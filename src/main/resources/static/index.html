        } catch (e) {
            console.error('[屏幕空间标签避让] 错误:', e);
        }
    }

    // 检测矩形重叠（屏幕空间）
    function isRectOverlap(rect1, rect2) {
        return !(rect1.right < rect2.left || 
                 rect1.left > rect2.right || 
                 rect1.bottom < rect2.top || 
                 rect1.top > rect2.bottom);
    }
    
    
    // 调整标签的屏幕偏移（将屏幕偏移转换为eyeOffset）
    function adjustLabelScreenOffset(labelInfo, screenOffsetX, screenOffsetY) {
        try {
            const camera = viewer.camera;
            
            // 计算相机到标签的距离
            const distance = Cesium.Cartesian3.distance(
                viewer.camera.position,
                labelInfo.labelWorldPos
            );
            
            if (distance < 1) {
                // 距离太近，跳过
                return;
            }
            
            // 使用更准确的方法：通过屏幕坐标反推世界坐标
            // 获取当前标签的屏幕位置
            const currentScreenPos = labelInfo.screenPos;
            if (!currentScreenPos) return;
            
            // 计算目标屏幕位置
            const targetScreenX = currentScreenPos.x + screenOffsetX;
            const targetScreenY = currentScreenPos.y + screenOffsetY;
            
            // 使用Cesium的pickRay来将屏幕坐标转换为世界坐标
            // 创建一个从相机到标签方向的射线
            const ray = viewer.camera.getPickRay(new Cesium.Cartesian2(targetScreenX, targetScreenY));
            if (!ray) return;
            
            // 计算射线与标签所在平面的交点
            // 使用标签到相机的距离来确定交点
            const direction = Cesium.Cartesian3.normalize(ray.direction, new Cesium.Cartesian3());
            const targetWorldPos = Cesium.Cartesian3.add(
                viewer.camera.position,
                Cesium.Cartesian3.multiplyByScalar(direction, distance, new Cesium.Cartesian3()),
                new Cesium.Cartesian3()
            );
            
            // 计算需要的世界坐标偏移
            const worldOffset = Cesium.Cartesian3.subtract(
                targetWorldPos,
                labelInfo.labelWorldPos,
                new Cesium.Cartesian3()
            );
            
            // 将世界坐标偏移转换为eyeOffset（相机空间）
            const cameraRight = camera.right;
            const cameraUp = camera.up;
            const cameraForward = camera.direction;
            
            const eyeOffsetX = Cesium.Cartesian3.dot(worldOffset, cameraRight);
            const eyeOffsetY = Cesium.Cartesian3.dot(worldOffset, cameraUp);
            const eyeOffsetZ = Cesium.Cartesian3.dot(worldOffset, cameraForward);
            
            labelInfo.eyeOffset.x += eyeOffsetX;
            labelInfo.eyeOffset.y += eyeOffsetY;
            labelInfo.eyeOffset.z += eyeOffsetZ;
        } catch (e) {
            console.warn('[adjustLabelScreenOffset] 错误:', e);
        }
    }
    
    // 更新标签的屏幕位置
    function updateScreenPosition(labelInfo) {
        try {
            const camera = viewer.camera;
            
            // 将eyeOffset转换为世界坐标偏移
            const worldOffset = new Cesium.Cartesian3(
                camera.right.x * labelInfo.eyeOffset.x + camera.up.x * labelInfo.eyeOffset.y + camera.direction.x * labelInfo.eyeOffset.z,
                camera.right.y * labelInfo.eyeOffset.x + camera.up.y * labelInfo.eyeOffset.y + camera.direction.y * labelInfo.eyeOffset.z,
                camera.right.z * labelInfo.eyeOffset.x + camera.up.z * labelInfo.eyeOffset.y + camera.direction.z * labelInfo.eyeOffset.z
            );
            
            // 更新标签的世界位置
            labelInfo.labelWorldPos = Cesium.Cartesian3.add(
                labelInfo.vehiclePos,
                worldOffset,
                new Cesium.Cartesian3()
            );
            
            // 重新投影到屏幕坐标
            const screenPos = Cesium.SceneTransforms.wgs84ToWindowCoordinates(
                viewer.scene,
                labelInfo.labelWorldPos
            );
            
            if (screenPos) {
                labelInfo.screenPos = screenPos;
                
                // 更新屏幕矩形
                const labelWidth = 120;
                const labelHeight = 40;
                const padding = 5;
                
                labelInfo.screenRect.centerX = screenPos.x;
                labelInfo.screenRect.centerY = screenPos.y;
                labelInfo.screenRect.left = screenPos.x - labelWidth / 2 - padding;
                labelInfo.screenRect.right = screenPos.x + labelWidth / 2 + padding;
                labelInfo.screenRect.top = screenPos.y - labelHeight / 2 - padding;
                labelInfo.screenRect.bottom = screenPos.y + labelHeight / 2 + padding;
            }
        } catch (e) {
            console.warn('[updateScreenPosition] 错误:', e);
        }
    }

    // 计算标签位置和偏移（根据布局方案）- 8个方向布局
    function calculateLabelOffset(point, entityId, vehiclePosition, layout) {
        try {
            // 根据entityId生成一个稳定的哈希值，用于计算偏移
            let hash = 0;
            if (entityId && entityId.length > 0) {
                for (let i = 0; i < entityId.length; i++) {
                    hash = ((hash << 5) - hash) + entityId.charCodeAt(i);
                    hash = hash & hash; // 转换为32位整数
                }
            }
            
            // 增加偏移距离到200-300m，避免标签太近
            const offsetDistance = 200 + (Math.abs(hash) % 101); // 200-300m
            // 增加高度变化范围，避免标签和引导线重合
            const offsetZ = (Math.abs(hash) % 101) - 50; // -50到50米，更大的高度变化
            
            let offsetX, offsetY, offsetAngle;
            
            // 8个布局方向：1-东，2-南，3-西，4-北，5-东南，6-东北，7-西南，8-西北
            // 所有方向统一偏转30度（30度 = Math.PI / 6）
            // 确保layout在有效范围内（1-8）
            const validLayout = (layout >= 1 && layout <= 8) ? layout : 5;
            const rotationOffset = Math.PI / 6; // 30度偏转
            
            switch(validLayout) {
                case 1: // 布局1: 东（90度 + 30度 = 120度）
                    offsetAngle = Math.PI / 2 + rotationOffset; // 90度 + 30度 = 120度
                    break;
                    
                case 2: // 布局2: 南（180度 + 30度 = 210度）
                    offsetAngle = Math.PI + rotationOffset; // 180度 + 30度 = 210度
                    break;
                    
                case 3: // 布局3: 西（270度 + 30度 = 300度）
                    offsetAngle = -Math.PI / 2 + rotationOffset; // -90度 + 30度 = -60度（300度）
                    break;
                    
                case 4: // 布局4: 北（0度 + 30度 = 30度）
                    offsetAngle = 0 + rotationOffset; // 0度 + 30度 = 30度
                    break;
                    
                case 5: // 布局5: 东南（135度 + 30度 = 165度）
                    offsetAngle = 3 * Math.PI / 4 + rotationOffset; // 135度 + 30度 = 165度
                    break;
                    
                case 6: // 布局6: 东北（45度 + 30度 = 75度）
                    offsetAngle = Math.PI / 4 + rotationOffset; // 45度 + 30度 = 75度
                    break;
                    
                case 7: // 布局7: 西南（225度 + 30度 = 255度）
                    offsetAngle = -3 * Math.PI / 4 + rotationOffset; // -135度 + 30度 = -105度（255度）
                    break;
                    
                case 8: // 布局8: 西北（315度 + 30度 = 345度）
                    offsetAngle = -Math.PI / 4 + rotationOffset; // -45度 + 30度 = -15度（345度）
                    break;
                    
                default:
                    offsetAngle = Math.PI / 4 + rotationOffset; // 默认：东北（45度 + 30度 = 75度）
            }
            
            // 计算偏移值
            offsetX = Math.sin(offsetAngle) * offsetDistance;
            offsetY = -Math.cos(offsetAngle) * offsetDistance;
            
            // 修复5：优化数值验证和错误处理
            // 验证所有值都是有效数字
            if (isNaN(offsetX) || isNaN(offsetY) || isNaN(offsetZ) || 
                !isFinite(offsetX) || !isFinite(offsetY) || !isFinite(offsetZ)) {
                console.error(`[calculateLabelOffset] ${entityId}: 计算结果包含无效值`, {
                    offsetX, offsetY, offsetZ, offsetDistance, offsetAngle, layout
                });
                // 返回安全的默认值（确保距离足够，引导线可见）
                return { offsetX: 200, offsetY: -200, offsetZ: 50 };
            }
            
            // 修复5：验证偏移距离是否足够（至少100米，确保引导线可见）
            const offsetMagnitude = Math.sqrt(offsetX * offsetX + offsetY * offsetY);
            if (offsetMagnitude < 100) {
                console.warn(`[calculateLabelOffset] ${entityId}: 偏移距离过小 ${offsetMagnitude.toFixed(2)}米，调整为100米`);
                const scale = 100 / offsetMagnitude;
                return { offsetX: offsetX * scale, offsetY: offsetY * scale, offsetZ: offsetZ };
            }
            
            return { offsetX, offsetY, offsetZ };
        } catch (e) {
            console.error(`[calculateLabelOffset] ${entityId}: 计算错误`, e);
            // 返回安全的默认值（确保距离足够，引导线可见）
            return { offsetX: 200, offsetY: -200, offsetZ: 50 };
        }
    }
    
    // 更新标签位置和连接线
    function updateLabelPosition(entity, point, entityId, vehiclePosition) {
        if (!vehiclePosition) {
            vehiclePosition = entity.position.getValue();
        }
        
        // 获取该标签的布局（如果已设置避让布局，使用避让布局；否则使用默认布局）
        let labelLayout = entityLayouts.get(entityId);
        if (!labelLayout) {
            labelLayout = currentLabelLayout;
            entityLayouts.set(entityId, labelLayout);
        }
        
        // 计算标签偏移（基础偏移，避让算法会在此基础上调整）
        const { offsetX, offsetY, offsetZ } = calculateLabelOffset(point, entityId, vehiclePosition, labelLayout);
        
        // 获取当前的eyeOffset（如果存在，可能是避让算法调整后的值）
        let currentEyeOffset = entity.label.eyeOffset;
        if (currentEyeOffset instanceof Cesium.Cartesian3) {
            currentEyeOffset = Cesium.Cartesian3.clone(currentEyeOffset);
        } else if (currentEyeOffset && currentEyeOffset.getValue) {
            currentEyeOffset = Cesium.Cartesian3.clone(currentEyeOffset.getValue());
        } else {
            currentEyeOffset = null;
        }
        
        // 计算基础偏移的世界坐标
        const cartographic = Cesium.Cartographic.fromCartesian(vehiclePosition);
        const latOffsetRadians = offsetY / 6378137;
        const lonOffsetRadians = offsetX / (6378137 * Math.cos(cartographic.latitude));
        const baseLabelWorldPos = Cesium.Cartesian3.fromRadians(
            cartographic.longitude + lonOffsetRadians,
            cartographic.latitude + latOffsetRadians,
            cartographic.height + offsetZ
        );
        
        // 如果当前eyeOffset存在，计算其对应的世界位置
        let currentLabelWorldPos = baseLabelWorldPos;
        if (currentEyeOffset) {
            const camera = viewer.camera;
            const worldOffset = new Cesium.Cartesian3(
                camera.right.x * currentEyeOffset.x + camera.up.x * currentEyeOffset.y + camera.direction.x * currentEyeOffset.z,
                camera.right.y * currentEyeOffset.x + camera.up.y * currentEyeOffset.y + camera.direction.y * currentEyeOffset.z,
                camera.right.z * currentEyeOffset.x + camera.up.z * currentEyeOffset.y + camera.direction.z * currentEyeOffset.z
            );
            currentLabelWorldPos = Cesium.Cartesian3.add(vehiclePosition, worldOffset, new Cesium.Cartesian3());
        }
        
        // 关键修复：检查该标签是否有避让布局（entityLayouts中有记录）
        // 如果有避让布局，说明避让算法已经设置了eyeOffset，应该保留它
        const hasAvoidanceLayout = entityLayouts.has(entityId);
        const savedLayout = entityLayouts.get(entityId);
        
        if (hasAvoidanceLayout && savedLayout && savedLayout !== currentLabelLayout) {
            // 该标签有避让布局，且与默认布局不同，说明是避让算法设置的
            // 检查当前eyeOffset是否与避让布局计算出的偏移一致
            const { offsetX: savedOffsetX, offsetY: savedOffsetY, offsetZ: savedOffsetZ } = 
                calculateLabelOffset(point, entityId, vehiclePosition, savedLayout);
            
            // 计算当前eyeOffset与避让布局计算出的偏移的差异
            if (currentEyeOffset && Cesium.defined(currentEyeOffset) &&
                !isNaN(currentEyeOffset.x) && !isNaN(currentEyeOffset.y) && !isNaN(currentEyeOffset.z) &&
                isFinite(currentEyeOffset.x) && isFinite(currentEyeOffset.y) && isFinite(currentEyeOffset.z)) {
                
                const savedEyeOffset = new Cesium.Cartesian3(savedOffsetX, savedOffsetY, savedOffsetZ);
                const diffX = Math.abs(currentEyeOffset.x - savedEyeOffset.x);
                const diffY = Math.abs(currentEyeOffset.y - savedEyeOffset.y);
                const diffZ = Math.abs(currentEyeOffset.z - savedEyeOffset.z);
                const diffMagnitude = Math.sqrt(diffX * diffX + diffY * diffY + diffZ * diffZ);
                
                // 如果差异很小（小于10米），说明eyeOffset已经正确，保留它
                // 如果差异很大，说明可能被其他地方修改了，重新设置为避让布局的偏移
                if (diffMagnitude < 10) {
                    // eyeOffset已经正确，保留它
                    // 不重置
                } else {
                    // eyeOffset被修改了，重新设置为避让布局的偏移
                    entity.label.eyeOffset = savedEyeOffset;
                }
            } else {
                // 当前eyeOffset无效，设置为避让布局的偏移
                entity.label.eyeOffset = new Cesium.Cartesian3(savedOffsetX, savedOffsetY, savedOffsetZ);
            }
        } else {
            // 没有避让布局，使用正常的逻辑
            if (currentEyeOffset && Cesium.defined(currentEyeOffset) &&
                !isNaN(currentEyeOffset.x) && !isNaN(currentEyeOffset.y) && !isNaN(currentEyeOffset.z) &&
                isFinite(currentEyeOffset.x) && isFinite(currentEyeOffset.y) && isFinite(currentEyeOffset.z)) {
                
                // 计算基础偏移和当前偏移的差异
                const offsetDiff = Cesium.Cartesian3.subtract(baseLabelWorldPos, currentLabelWorldPos, new Cesium.Cartesian3());
                const offsetDiffLength = Cesium.Cartesian3.magnitude(offsetDiff);
                
                // 如果差异很小（小于50米），说明可能是车辆位置变化导致的，重置为基础偏移
                // 如果差异很大（超过50米），说明可能是避让算法设置的，保留它
                if (offsetDiffLength < 50) {
                    // 差异很小，重置为基础偏移
                    entity.label.eyeOffset = new Cesium.Cartesian3(offsetX, offsetY, offsetZ);
                }
                // 否则保持当前的eyeOffset，不重置
            } else {
                // 当前eyeOffset无效，重置为基础偏移
                entity.label.eyeOffset = new Cesium.Cartesian3(offsetX, offsetY, offsetZ);
            }
        }
        
        // 计算标签的实际世界坐标位置（使用当前的eyeOffset，而不是基础偏移）
        const finalEyeOffset = entity.label.eyeOffset;
        const camera = viewer.camera;
        const finalWorldOffset = new Cesium.Cartesian3(
            camera.right.x * finalEyeOffset.x + camera.up.x * finalEyeOffset.y + camera.direction.x * finalEyeOffset.z,
            camera.right.y * finalEyeOffset.x + camera.up.y * finalEyeOffset.y + camera.direction.y * finalEyeOffset.z,
            camera.right.z * finalEyeOffset.x + camera.up.z * finalEyeOffset.y + camera.direction.z * finalEyeOffset.z
        );
        const labelWorldPosition = Cesium.Cartesian3.add(vehiclePosition, finalWorldOffset, new Cesium.Cartesian3());
        
        // 更新或创建连接线（全面修复 + 调试）
        // 使用闭包保存point和entityId，避免在CallbackProperty中访问可能变化的值
        // 关键：不保存savedLabelWorldPosition，而是每次在CallbackProperty中动态计算，确保使用最新的eyeOffset
        const savedPoint = point;
        const savedEntityId = entityId;
        const savedVehiclePosition = vehiclePosition;
        // 注意：不再保存savedLabelWorldPosition，而是在CallbackProperty中动态计算
        
        // 调试计数器，用于追踪特定车辆的引导线
        const debugCounter = { count: 0 };
        
        const createPolylineCallback = () => {
            return new Cesium.CallbackProperty(() => {
                debugCounter.count++;
                // 每100次调用输出一次调试信息（避免刷屏）
                const shouldDebug = debugCounter.count % 100 === 0;
                
                // 关键修复：不依赖闭包捕获的entity，而是通过vehicleEntities Map获取最新的entity
                // 这样可以确保每次都能访问到最新的eyeOffset（包括避让算法修改后的值）
                let currentEntity = vehicleEntities.get(savedEntityId);
                if (!currentEntity) {
                    // 如果从Map中获取不到，尝试使用闭包捕获的entity（向后兼容）
                    currentEntity = entity;
                }
                
                // 关键：确保总是返回有效的坐标数组，即使计算失败也要返回一个基本的引导线
                
                try {
                    // 获取当前实体位置
                    if (!currentEntity || !currentEntity.position) {
                        if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: entity或position不存在`);
                        // 使用简单的fallback：计算一个默认偏移位置
                        try {
                            const cart = Cesium.Cartographic.fromCartesian(savedVehiclePosition);
                            const fallbackPos = Cesium.Cartesian3.fromRadians(
                                cart.longitude + 200 / (6378137 * Math.cos(cart.latitude)),
                                cart.latitude + 200 / 6378137,
                                (cart.height || 0) + 50
                            );
                            return [savedVehiclePosition, fallbackPos];
                        } catch (e) {
                            return [savedVehiclePosition, savedVehiclePosition]; // 最后的fallback
                        }
                    }
                    
                    let currentPos;
                    try {
                        currentPos = currentEntity.position.getValue();
                    } catch (e) {
                        if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: 获取position失败`, e);
                        // 使用简单的fallback
                        try {
                            const cart = Cesium.Cartographic.fromCartesian(savedVehiclePosition);
                            const fallbackPos = Cesium.Cartesian3.fromRadians(
                                cart.longitude + 200 / (6378137 * Math.cos(cart.latitude)),
                                cart.latitude + 200 / 6378137,
                                (cart.height || 0) + 50
                            );
                            return [savedVehiclePosition, fallbackPos];
                        } catch (e2) {
                            return [savedVehiclePosition, savedVehiclePosition];
                        }
                    }
                    
                    if (!currentPos || !Cesium.defined(currentPos)) {

                    if (typeof currentPos.x !== 'number' || typeof currentPos.y !== 'number' || typeof currentPos.z !== 'number' ||

                        !isFinite(currentPos.x) || !isFinite(currentPos.y) || !isFinite(currentPos.z)) {
                        if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: currentPos包含无效值`, currentPos);

                        try {

                            );
                            return [savedVehiclePosition, fallbackPos];
                        } catch (e) {

                    }
                    
                    // 转换为地理坐标
                    let cart;
                    try {
                        cart = Cesium.Cartographic.fromCartesian(currentPos);
                    } catch (e) {
                        if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: 坐标转换失败`, e);
                        // 使用简单的fallback
                        try {
                            const cart2 = Cesium.Cartographic.fromCartesian(savedVehiclePosition);

                            );
                            return [savedVehiclePosition, fallbackPos];

                    }
                    
                    if (!cart || isNaN(cart.longitude) || isNaN(cart.latitude) ||

                        // 使用简单的fallback

                            );

                    }
                    
                    // 关键修复：始终使用最新的eyeOffset计算标签位置
                    // 策略1：优先使用当前的eyeOffset（可能是避让算法调整后的值）
                    let labelWorldPos = null;
                    
                    // 关键：使用currentEntity而不是闭包捕获的entity，确保获取到最新的eyeOffset
                    if (currentEntity.label && currentEntity.label.eyeOffset) {
                        try {
                            // 获取当前的eyeOffset（可能是避让算法调整后的值）
                            let currentEyeOffset = currentEntity.label.eyeOffset;
                            if (currentEyeOffset instanceof Cesium.Cartesian3) {
                                currentEyeOffset = Cesium.Cartesian3.clone(currentEyeOffset);
                            } else if (currentEyeOffset && currentEyeOffset.getValue) {
                                currentEyeOffset = Cesium.Cartesian3.clone(currentEyeOffset.getValue());
                            } else {
                                currentEyeOffset = null;
                            }
                            
                            if (currentEyeOffset && Cesium.defined(currentEyeOffset) &&
                                !isNaN(currentEyeOffset.x) && !isNaN(currentEyeOffset.y) && !isNaN(currentEyeOffset.z) &&
                                isFinite(currentEyeOffset.x) && isFinite(currentEyeOffset.y) && isFinite(currentEyeOffset.z)) {
                                
                                // 将eyeOffset转换为世界坐标偏移
                                const camera = viewer.camera;
                                const worldOffset = new Cesium.Cartesian3(
                                    camera.right.x * currentEyeOffset.x + camera.up.x * currentEyeOffset.y + camera.direction.x * currentEyeOffset.z,
                                    camera.right.y * currentEyeOffset.x + camera.up.y * currentEyeOffset.y + camera.direction.y * currentEyeOffset.z,
                                    camera.right.z * currentEyeOffset.x + camera.up.z * currentEyeOffset.y + camera.direction.z * currentEyeOffset.z
                                );
                                
                                // 计算标签的实际世界坐标位置
                                labelWorldPos = Cesium.Cartesian3.add(currentPos, worldOffset, new Cesium.Cartesian3());
                                
                                // 验证labelPos并确保高度合理（避免被地形裁剪）
                                if (labelWorldPos && Cesium.defined(labelWorldPos) &&
                                    !isNaN(labelWorldPos.x) && !isNaN(labelWorldPos.y) && !isNaN(labelWorldPos.z) &&

                                    try {

                                        if (startCart.height < 0) {
                                            startPos = Cesium.Cartesian3.fromRadians(

                    }
                    
                    // 策略2：如果eyeOffset无效，使用布局方案重新计算标签位置
                    // 这样可以确保即使eyeOffset无效，引导线也能显示
                    try {
                        // 获取当前布局（优先使用避让布局，否则使用默认布局）
                        let layout = entityLayouts.get(savedEntityId);
                        if (!layout) {
                            layout = currentLabelLayout;
                        }
                        
                        // 使用布局方案重新计算标签位置
                        const { offsetX, offsetY, offsetZ } = calculateLabelOffset(savedPoint, savedEntityId, currentPos, layout);
                        
                        // 验证计算结果
                        if (!isNaN(offsetX) && !isNaN(offsetY) && !isNaN(offsetZ) &&
                            isFinite(offsetX) && isFinite(offsetY) && isFinite(offsetZ)) {
                            
                            // 转换为地理坐标
                            const latOffsetRadians = offsetY / 6378137;
                            const lonOffsetRadians = offsetX / (6378137 * Math.cos(cart.latitude));
                            
                            // 计算标签的世界坐标位置
                            labelWorldPos = Cesium.Cartesian3.fromRadians(
                                cart.longitude + lonOffsetRadians,
                                cart.latitude + latOffsetRadians,
                                (cart.height || 0) + offsetZ
                            );
                            
                            // 验证labelPos并确保高度合理（避免被地形裁剪）
                            if (labelWorldPos && Cesium.defined(labelWorldPos) &&
                                !isNaN(labelWorldPos.x) && !isNaN(labelWorldPos.y) && !isNaN(labelWorldPos.z) &&

                                // 确保起点和终点都在合理的高度（至少在地面上方）

                                // 如果起点高度过低，稍微抬高
                                try {

                                try {
                                    const endCart = Cesium.Cartographic.fromCartesian(endPos);
                                    if (endCart.height < 0) {
                                        endPos = Cesium.Cartesian3.fromRadians(
                                            endCart.longitude,
                                            endCart.latitude,
                                            Math.max(0, endCart.height) + 1.0
                                        );
                                    }
                                } catch (e) {
                                    // 忽略错误
                                }
                                
                                return [startPos, endPos];
                            }
                        }
                    } catch (e) {
                        if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: 布局计算失败`, e);
                    }
                    
                    // 策略3：最后的fallback - 使用默认布局计算标签位置
                    // 确保即使所有方法都失败，也能显示引导线
                    try {
                        // 使用默认布局（布局6：东北方向）
                        const defaultLayout = currentLabelLayout;
                        const { offsetX, offsetY, offsetZ } = calculateLabelOffset(savedPoint, savedEntityId, currentPos, defaultLayout);
                        
                        if (!isNaN(offsetX) && !isNaN(offsetY) && !isNaN(offsetZ) &&
                            isFinite(offsetX) && isFinite(offsetY) && isFinite(offsetZ)) {
                            
                            const latOffsetRadians = offsetY / 6378137;
                            const lonOffsetRadians = offsetX / (6378137 * Math.cos(cart.latitude));
                            
                            labelWorldPos = Cesium.Cartesian3.fromRadians(
                                cart.longitude + lonOffsetRadians,
                                cart.latitude + latOffsetRadians,
                                (cart.height || 0) + offsetZ
                            );
                            
                            // 验证labelPos并确保高度合理（避免被地形裁剪）
                            if (labelWorldPos && Cesium.defined(labelWorldPos) &&
                                !isNaN(labelWorldPos.x) && !isNaN(labelWorldPos.y) && !isNaN(labelWorldPos.z) &&
                                isFinite(labelWorldPos.x) && isFinite(labelWorldPos.y) && isFinite(labelWorldPos.z)) {
                                // 确保起点和终点都在合理的高度（至少在地面上方）
                                let startPos = currentPos;
                                let endPos = labelWorldPos;
                                
                                // 如果起点高度过低，稍微抬高
                                try {
                                    const startCart = Cesium.Cartographic.fromCartesian(startPos);
                                    if (startCart.height < 0) {

                                // 如果终点高度过低，稍微抬高
                                try {
                                    const endCart = Cesium.Cartographic.fromCartesian(endPos);
                                    if (endCart.height < 0) {

                                            endCart.longitude,
                                            endCart.latitude,
                                            Math.max(0, endCart.height) + 1.0
                                        );
                                    }
                                } catch (e) {
                                    // 忽略错误
                                }
                                
                                return [startPos, endPos];
                            }
                        }
                    } catch (e) {
                        if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: 默认布局计算失败`, e);
                    }
                    
                    // 最后的fallback：返回一个简单的偏移位置（确保引导线至少能显示）
                    if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: 所有方法都失败，使用简单fallback`);
                    // 使用一个简单的偏移（东北方向，300米）
                    // 确保cart已定义，如果未定义则使用currentPos重新计算
                    let finalCart = cart;
                    if (!finalCart || isNaN(finalCart.longitude) || isNaN(finalCart.latitude)) {
                        try {
                            finalCart = Cesium.Cartographic.fromCartesian(currentPos);
                        } catch (e) {
                            // 如果还是失败，使用savedVehiclePosition
                            try {
                                finalCart = Cesium.Cartographic.fromCartesian(savedVehiclePosition);
                            } catch (e2) {
                                // 最后的fallback：返回相同位置（至少不会报错）
                                return [currentPos, currentPos];
                            }
                        }
                    }
                    
                    if (finalCart && !isNaN(finalCart.longitude) && !isNaN(finalCart.latitude)) {
                        const simpleOffset = Cesium.Cartesian3.fromRadians(
                            finalCart.longitude + 200 / (6378137 * Math.cos(finalCart.latitude)),
                            finalCart.latitude + 200 / 6378137,
                            (finalCart.height || 0) + 50
                        );
                        // 验证simpleOffset并确保高度合理（避免被地形裁剪）
                        if (simpleOffset && Cesium.defined(simpleOffset) &&
                            !isNaN(simpleOffset.x) && !isNaN(simpleOffset.y) && !isNaN(simpleOffset.z) &&
                            isFinite(simpleOffset.x) && isFinite(simpleOffset.y) && isFinite(simpleOffset.z)) {
                            // 确保起点和终点都在合理的高度（至少在地面上方）
                            let startPos = currentPos;
                            let endPos = simpleOffset;
                            
                            // 如果起点高度过低，稍微抬高
                            try {
                                const startCart = Cesium.Cartographic.fromCartesian(startPos);
                                if (startCart.height < 0) {
                                    startPos = Cesium.Cartesian3.fromRadians(
                                        startCart.longitude,
                                        startCart.latitude,

                                        Math.max(0, endCart.height) + 1.0
                                    );

                                // 忽略错误

                            return [startPos, endPos];

                    // 如果所有方法都失败，至少返回一个基本的引导线（使用当前位置，但确保高度合理）
                    let finalStartPos = currentPos;
                    let finalEndPos = currentPos;
                    
                    // 确保起点和终点都在合理的高度
                    try {
                        const startCart = Cesium.Cartographic.fromCartesian(finalStartPos);
                        if (startCart.height < 0) {
                            finalStartPos = Cesium.Cartesian3.fromRadians(
                                startCart.longitude,
                                startCart.latitude,
                                Math.max(0, startCart.height) + 1.0
                            );
                            finalEndPos = Cesium.Cartesian3.fromRadians(
                                startCart.longitude,
                                startCart.latitude,
                                Math.max(0, startCart.height) + 50.0
                            );
                        } else {
                            finalEndPos = Cesium.Cartesian3.fromRadians(
                                startCart.longitude,
                                startCart.latitude,
                                startCart.height + 50.0
                            );
                        }
                    } catch (e) {
                        // 忽略错误，使用原始位置
                    }
                    
                    return [finalStartPos, finalEndPos];
                } catch (e) {
                    console.error(`[引导线错误] ${savedEntityId}: 未捕获的异常`, e);
                    // 使用简单的fallback：计算一个默认偏移位置
                    try {
                        const cart = Cesium.Cartographic.fromCartesian(savedVehiclePosition);
                        const fallbackPos = Cesium.Cartesian3.fromRadians(
                            cart.longitude + 200 / (6378137 * Math.cos(cart.latitude)),
                            cart.latitude + 200 / 6378137,
                            (cart.height || 0) + 50
                        );
                        return [savedVehiclePosition, fallbackPos];
                    } catch (e2) {
                        return [savedVehiclePosition, savedVehiclePosition]; // 最后的fallback
                    }
                }
            }, false);
        };
        
        // 简化show属性：直接设置为true，不使用CallbackProperty，避免显示问题
        // 强制重新创建polyline，确保所有属性都正确
        // 先移除旧的polyline属性（如果存在）
        if (entity.polyline) {
            try {
                // 尝试清理旧的属性
                if (entity.polyline.positions && entity.polyline.positions instanceof Cesium.CallbackProperty) {
                    // CallbackProperty无法直接删除，但可以重新赋值
                }
            } catch (e) {
                // 忽略错误
            }
        }
        
        // 创建新的polyline（每次都重新创建，确保一致性）
        // 关键修复：show直接设置为true，不使用CallbackProperty
        entity.polyline = {
            positions: createPolylineCallback(),
            width: 3,
            material: Cesium.Color.BLUE.withAlpha(0.9), // 提高不透明度
            clampToGround: false,
            show: true,  // 直接设置为true，不使用CallbackProperty
            disableDepthTestDistance: Number.POSITIVE_INFINITY,  // 确保在最顶层显示
            arcType: Cesium.ArcType.NONE, // 直线连接
            distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0.0, Number.POSITIVE_INFINITY), // 确保始终可见
            shadows: Cesium.ShadowMode.DISABLED, // 禁用阴影
            classificationType: Cesium.ClassificationType.BOTH, // 确保在地面和3D Tiles上都可见
            depthFailMaterial: Cesium.Color.BLUE.withAlpha(0.9), // 深度测试失败时的材质
            // 确保引导线不被视锥体裁剪
            granularity: undefined, // 使用默认精度
            // 确保引导线在远距离也可见
            followSurface: false // 不跟随表面，使用直线
        };
        
        // 强制触发渲染
        viewer.scene.requestRender();
        
        // 验证并修复polyline（延迟验证，确保Cesium已处理）
        setTimeout(() => {
            if (entity.polyline) {
                const positions = entity.polyline.positions;
                const show = entity.polyline.show;
                let showValue = true;
                try {
                    if (show instanceof Cesium.CallbackProperty) {
                        showValue = show.getValue();
                    } else {
                        showValue = show;
                    }
                } catch (e) {
                    showValue = true;
                }
                
                // 如果show为false，强制设置为true
                if (!showValue) {
                    console.warn(`[引导线修复] ${entityId}: show为false，强制设置为true`);
                    entity.polyline.show = true;
                    viewer.scene.requestRender();
                }
                
                // 验证positions是否有效
                try {
                    if (positions instanceof Cesium.CallbackProperty) {
                        const posArray = positions.getValue();
                        if (!posArray || !Array.isArray(posArray) || posArray.length !== 2) {

                        hasPolyline: !!entity.polyline,

                        hasShow: !!show,

                        hasMaterial: !!entity.polyline.material
                    });
                }
            } else {
                console.error(`[引导线错误] ${entityId}: polyline不存在`);
            }
        }, 200);
    }

    // 创建车辆实体 - 使用point.timeStampStr显示时间（支持禁用引导线）
    function createVehicleEntity(point, entityId, vehiclePositions, disablePolyline = false) {
        // 判断是否为预测点（specialFlag字段为99，支持数字和字符串类型）
        // 调试：检查 specialFlag 的值和类型
        if (point.specialFlag !== undefined && point.specialFlag !== null) {
            console.log(`[调试-创建] 车辆 ${point.name} (ID: ${point.id}) specialFlag:`, point.specialFlag, "类型:", typeof point.specialFlag);
        }
        const isPredicted = point.specialFlag === 99 || point.specialFlag === "99";
        
        // 根据是否为预测点设置不同的颜色
        // 预测点：位置点和标签都使用绿色
        // 普通点：位置点根据direction设置（1=红色，其他=蓝色），标签使用橙色
        const pointColor = isPredicted 
            ? Cesium.Color.GREEN
            : (point.direction === 1 ? Cesium.Color.RED : Cesium.Color.BLUE);
        const labelColor = isPredicted 
            ? Cesium.Color.GREEN 
            : new Cesium.Color(1.0, 0.647, 0.0, 1.0); // 橙色
        
        // 车辆位置
        const currentPosition = Cesium.Cartesian3.fromDegrees(point.longitude, point.latitude);
        
        // 使用布局计算函数计算标签偏移
        const { offsetX, offsetY, offsetZ } = calculateLabelOffset(point, entityId, currentPosition, currentLabelLayout);
        
        // 计算标签的实际世界坐标位置（考虑3D偏移）
        const cartographic = Cesium.Cartographic.fromCartesian(currentPosition);
        const latOffsetRadians = offsetY / 6378137;
        const lonOffsetRadians = offsetX / (6378137 * Math.cos(cartographic.latitude));
        const labelWorldPosition = Cesium.Cartesian3.fromRadians(
            cartographic.longitude + lonOffsetRadians,
            cartographic.latitude + latOffsetRadians,
            cartographic.height + offsetZ
        );
        
        return {
            position: currentPosition,
            point: {
                pixelSize: 6, // 减小点大小
                color: pointColor,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 1, // 减小边框宽度
                disableDepthTestDistance: Number.POSITIVE_INFINITY, // 确保在最顶层显示
                height: 0 // 设置height为0，避免地形轮廓线警告
            },
            label: {
                // 在标签中显示车牌号和时间戳字符串
                text: `${point.name} | ${point.timeStampStr}`,
                font: '16px sans-serif', // 字号改为16
                fillColor: labelColor,
                outlineColor: Cesium.Color.BLACK, // 黑色描边
                outlineWidth: 3, // 描边宽度
                style: Cesium.LabelStyle.FILL_AND_OUTLINE, // 确保使用填充和描边样式
                
                // 使用eyeOffset实现3D空间偏移（根据布局方案）
                // eyeOffset是相对于相机视角的3D偏移，不受entity.position影响
                eyeOffset: new Cesium.Cartesian3(offsetX, offsetY, offsetZ),
                
                // 标签显示逻辑：默认显示，只在极端情况下才隐藏
                show: new Cesium.CallbackProperty(() => {
                    const cameraHeight = viewer.camera.positionCartographic.height;
                    const entityCount = vehicleEntities.size;
                    
                    // LOD策略（放宽限制，确保标签正常显示）：
                    // 1. 实体数量少时，全部显示
                    // 2. 实体数量多时，根据相机高度决定显示范围（放宽高度限制）
                    // 3. 只在极端情况下（超大量数据且相机很高）才隐藏
                    if (entityCount <= 200) {
                        return true; // 少量实体，全部显示
                    } else if (entityCount <= 500) {
                        return cameraHeight <= 5000; // 中等数量，放宽到5000米
                    } else if (entityCount <= 1000) {
                        return cameraHeight <= 4000; // 大量实体，放宽到4000米
                    } else if (entityCount <= 5000) {
                        return cameraHeight <= 3000; // 超大量实体，放宽到3000米
                    } else if (entityCount <= 10000) {
                        return cameraHeight <= 2000; // 极大量实体，放宽到2000米
                    } else {
                        // 3万条数据：放宽到1000米，确保在正常视角下可见
                        return cameraHeight <= 1000;
                    }
                }, false),
                disableDepthTestDistance: Number.POSITIVE_INFINITY  // 确保在最顶层显示
            },
            // 引导线：大量数据时可选择禁用
            ...(disablePolyline ? {} : {
                polyline: {
                // 连接线：从轨迹点到标签位置（使用CallbackProperty动态更新，优先使用eyeOffset）
                positions: new Cesium.CallbackProperty(() => {
                    try {
                        const entity = vehicleEntities.get(entityId);
                        if (!entity || !entity.position) {
                            return [currentPosition, labelWorldPosition];
                        }
                        
                        let currentPos;
                        try {
                            currentPos = entity.position.getValue();
                        } catch (e) {
                            return [currentPosition, labelWorldPosition];
                        }
                        
                        if (!currentPos || !Cesium.defined(currentPos) ||
                            isNaN(currentPos.x) || isNaN(currentPos.y) || isNaN(currentPos.z) ||
                            !isFinite(currentPos.x) || !isFinite(currentPos.y) || !isFinite(currentPos.z)) {
                            return [currentPosition, labelWorldPosition];
                        }
                        
                        // 关键修复：优先使用当前的eyeOffset（可能是避让算法调整后的值）
                        if (entity.label && entity.label.eyeOffset) {
                            try {
                                let currentEyeOffset = entity.label.eyeOffset;
                                if (currentEyeOffset instanceof Cesium.Cartesian3) {
                                    currentEyeOffset = Cesium.Cartesian3.clone(currentEyeOffset);
                                } else if (currentEyeOffset && currentEyeOffset.getValue) {
                                    currentEyeOffset = Cesium.Cartesian3.clone(currentEyeOffset.getValue());
                                } else {
                                    currentEyeOffset = null;
                                }
                                
                                if (currentEyeOffset && Cesium.defined(currentEyeOffset) &&
                                    !isNaN(currentEyeOffset.x) && !isNaN(currentEyeOffset.y) && !isNaN(currentEyeOffset.z) &&
                                    isFinite(currentEyeOffset.x) && isFinite(currentEyeOffset.y) && isFinite(currentEyeOffset.z)) {
                                    
                                    // 将eyeOffset转换为世界坐标偏移
                                    const camera = viewer.camera;
                                    const worldOffset = new Cesium.Cartesian3(
                                        camera.right.x * currentEyeOffset.x + camera.up.x * currentEyeOffset.y + camera.direction.x * currentEyeOffset.z,
                                        camera.right.y * currentEyeOffset.x + camera.up.y * currentEyeOffset.y + camera.direction.y * currentEyeOffset.z,
                                        camera.right.z * currentEyeOffset.x + camera.up.z * currentEyeOffset.y + camera.direction.z * currentEyeOffset.z
                                    );
                                    
                                    // 计算标签的实际世界坐标位置
                                    const labelWorldPos = Cesium.Cartesian3.add(currentPos, worldOffset, new Cesium.Cartesian3());
                                    
                                    // 验证labelPos并确保高度合理（避免被地形裁剪）
                                    if (labelWorldPos && Cesium.defined(labelWorldPos) &&
                                        !isNaN(labelWorldPos.x) && !isNaN(labelWorldPos.y) && !isNaN(labelWorldPos.z) &&
                                        isFinite(labelWorldPos.x) && isFinite(labelWorldPos.y) && isFinite(labelWorldPos.z)) {
                                        // 确保起点和终点都在合理的高度（至少在地面上方）
                                        let startPos = currentPos;
                                        let endPos = labelWorldPos;
                                        
                                        // 如果起点高度过低，稍微抬高
                                        try {
                                            const startCart = Cesium.Cartographic.fromCartesian(startPos);
                                            if (startCart.height < 0) {
                                                startPos = Cesium.Cartesian3.fromRadians(
                                                    startCart.longitude,
                                                    startCart.latitude,
                                                    Math.max(0, startCart.height) + 1.0
                                                );
                                            }
                                        } catch (e) {
                                            // 忽略错误
                                        }
                                        
                                        // 如果终点高度过低，稍微抬高
                                        try {
                                            const endCart = Cesium.Cartographic.fromCartesian(endPos);
                                            if (endCart.height < 0) {
                                                endPos = Cesium.Cartesian3.fromRadians(
                                                    endCart.longitude,
                                                    endCart.latitude,
                                                    Math.max(0, endCart.height) + 1.0
                                                );
                                            }
                                        } catch (e) {
                                            // 忽略错误
                                        }
                                        
                                        return [startPos, endPos];
                                    }
                                }
                            } catch (e) {
                                // 如果eyeOffset计算失败，继续使用布局方案
                            }
                        }
                        
                        // 策略2：如果eyeOffset无效，使用布局方案重新计算标签位置
                        let cart;
                        try {
                            cart = Cesium.Cartographic.fromCartesian(currentPos);
                        } catch (e) {
                            return [currentPosition, labelWorldPosition];
                        }
                        
                        if (!cart || isNaN(cart.longitude) || isNaN(cart.latitude) ||
                            !isFinite(cart.longitude) || !isFinite(cart.latitude)) {
                            return [currentPosition, labelWorldPosition];
                        }
                        
                        // 获取当前布局（优先使用避让布局，否则使用默认布局）
                        let layout = entityLayouts.get(entityId);
                        if (!layout) {
                            layout = currentLabelLayout;
                        }
                        
                        const offset = calculateLabelOffset(point, entityId, currentPos, layout);
                        
                        if (isNaN(offset.offsetX) || isNaN(offset.offsetY) || isNaN(offset.offsetZ) ||
                            !isFinite(offset.offsetX) || !isFinite(offset.offsetY) || !isFinite(offset.offsetZ)) {
                            return [currentPosition, labelWorldPosition];
                        }
                        
                        const cosLat = Math.cos(cart.latitude);
                        if (Math.abs(cosLat) < 0.0001) {
                            // 极地附近，使用简化计算
                            const latOff = offset.offsetY / 6378137;
                            const lonOff = offset.offsetX / 6378137;
                            const labelPos = Cesium.Cartesian3.fromRadians(
                                cart.longitude + lonOff,
                                cart.latitude + latOff,
                                (cart.height || 0) + offset.offsetZ
                            );
                            if (labelPos && Cesium.defined(labelPos) &&
                                !isNaN(labelPos.x) && !isNaN(labelPos.y) && !isNaN(labelPos.z)) {
                                return [currentPos, labelPos];
                            }
                        } else {
                            const latOff = offset.offsetY / 6378137;
                            const lonOff = offset.offsetX / (6378137 * cosLat);
                            
                            if (isNaN(latOff) || isNaN(lonOff) ||
                                !isFinite(latOff) || !isFinite(lonOff)) {
                                return [currentPosition, labelWorldPosition];
                            }
                            
                            let labelPos;
                            try {
                                labelPos = Cesium.Cartesian3.fromRadians(
                                    cart.longitude + lonOff,
                                    cart.latitude + latOff,
                                    (cart.height || 0) + offset.offsetZ
                                );
                            } catch (e) {
                                return [currentPosition, labelWorldPosition];
                            }
                            
                            if (labelPos && Cesium.defined(labelPos) &&
                                !isNaN(labelPos.x) && !isNaN(labelPos.y) && !isNaN(labelPos.z) &&
                                isFinite(labelPos.x) && isFinite(labelPos.y) && isFinite(labelPos.z)) {
                                return [currentPos, labelPos];
                            }
                        }
                        
                        return [currentPosition, labelWorldPosition];
                    } catch (e) {
                        return [currentPosition, labelWorldPosition];
                    }
                }, false),
                width: 3, // 增加线宽，更容易看到
                material: Cesium.Color.BLUE.withAlpha(0.9), // 增加不透明度到0.9，更容易看到
                clampToGround: false, // 不贴地，使用3D空间
                show: true,  // 关键：直接设置为true，确保显示（不使用CallbackProperty）
                disableDepthTestDistance: Number.POSITIVE_INFINITY,  // 确保在最顶层显示
                arcType: Cesium.ArcType.NONE, // 直线连接
                distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0.0, Number.POSITIVE_INFINITY), // 确保始终可见
                shadows: Cesium.ShadowMode.DISABLED, // 禁用阴影避免遮挡
                classificationType: Cesium.ClassificationType.BOTH, // 确保在地面和3D Tiles上都可见
                depthFailMaterial: Cesium.Color.BLUE.withAlpha(0.9), // 深度测试失败时的材质
                // 关键修复：确保引导线完整显示
                scaleByDistance: undefined, // 不使用距离缩放
                translucencyByDistance: undefined, // 不使用距离透明度
                // 确保引导线不被视锥体裁剪
                granularity: undefined, // 使用默认精度
                // 确保引导线在远距离也可见
                followSurface: false // 不跟随表面，使用直线
                }
            })
        };
    }

    // 刷新车辆列表 - 使用point.timeStampStr显示时间
    async function refreshVehicleList() {
        try {
            const response = await fetch(`http://${broker}:${serverPort}/points`);
            const points = await response.json();

            // 清空现有列表
            vehicleList.innerHTML = '<option value="">-- 请选择车辆 --</option>';

            // 添加新选项 - 显示车牌号和时间戳
            points.forEach((point, index) => {
                const option = document.createElement('option');
                option.value = point.name;
                // 在选项中显示车牌号和时间戳
                option.textContent = `${index + 1}. ${point.name} (${point.timeStampStr})`;
                vehicleList.appendChild(option);
            });

            updateStatus('车辆列表已刷新');

        } catch (error) {
            updateStatus(`刷新失败: ${error.message}`);
        }
    }

    // 聚焦选定车辆
    function focusVehicle() {
        const selectedPlate = vehicleList.value;
        if (!selectedPlate) return;

        // 在现有车辆中查找
        for (const [id, entity] of vehicleEntities) {
            if (id.startsWith(selectedPlate)) {
                viewer.camera.flyTo({
                    destination: entity.position.getValue(Cesium.JulianDate.now()),
                    offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-30), 500),
                    duration: 1
                });
                return;
            }
        }

        updateStatus('车辆当前不可见');
    }

    // 加载基站数据并可视化
    async function loadBaseStations() {

            if (!response.ok) {
                console.error('获取基站数据失败:', response.status);
                return;
            }
            
            const stations = await response.json();
            console.log('加载到 ' + stations.length + ' 个基站');
            
            // 创建所有基站实体

    // 创建基站实体（位置圆点和监测范围圆）
    function createBaseStationEntity(station) {
        const entityId = `basestation_${station.stationId}`;
        
        // 如果已存在，先移除
        if (baseStationEntities.has(entityId)) {
            viewer.entities.remove(baseStationEntities.get(entityId));
        }
        
        // 将监测范围（米）转换为弧度（用于Cesium的圆形）
        // Cesium的圆形半径单位是米，所以直接使用
        const radiusInMeters = station.coverageRadius;
        
        // 标签高度（米）- 引导线终点高度
        const labelHeight = 120; // 增加高度确保引导线可见
        const labelOffset = 40; // 标签像素偏移量
        
        // 基站位置（地面位置）
        const basePosition = Cesium.Cartesian3.fromDegrees(station.longitude, station.latitude);
        
        // 创建引导线的起点和终点位置
        // 起点：地面位置（使用相对高度0，确保贴地）
        const groundStart = Cesium.Cartesian3.fromDegrees(
            station.longitude, 
            station.latitude, 
            0
        );
        
        // 终点：标签位置（相对地面高度，确保引导线向上延伸）
        const labelEnd = Cesium.Cartesian3.fromDegrees(
            station.longitude, 
            station.latitude, 
            labelHeight
        );
        
        // 创建基站实体
        const entity = viewer.entities.add({
            id: entityId,
            // 基站位置圆点
            position: basePosition,
            point: {
                pixelSize: 10,
                color: Cesium.Color.BLUE,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 2,
                disableDepthTestDistance: 100000,
                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND // 贴地显示
            },
            // 监测范围圆（浅色透明度适中）
            // 修复ellipse内部破碎：使用相对高度而不是CLAMP_TO_GROUND，避免采样不一致
            ellipse: {
                semiMajorAxis: radiusInMeters,
                semiMinorAxis: radiusInMeters,
                material: new Cesium.ColorMaterialProperty(
                    new Cesium.Color(0.3, 0.5, 1.0, 0.3) // 浅蓝色，透明度0.3
                ),
                // 关键修复：移除outline，因为Cesium不支持在贴地ellipse上显示outline
                outline: false, // 改为false，避免渲染冲突导致破碎
                // 关键修复：使用相对高度而不是CLAMP_TO_GROUND，避免内部破碎
                height: 0.1, // 稍微抬高0.1米，避免与地形冲突
                heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND, // 改为相对地面高度，避免采样不一致
                // 增加granularity精度，每0.25度一个点（更密集的采样）
                granularity: Cesium.Math.PI / 720, // 每0.25度一个点，确保圆形完整不破碎
                rotation: 0, // 确保圆形正对上方
                // 设置足够的垂直分割线，确保圆形完整显示
                numberOfVerticalLines: 128, // 增加到128，提供更多的垂直分割线
                // 确保圆形始终可见
                distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0.0, Number.POSITIVE_INFINITY),
                shadows: Cesium.ShadowMode.DISABLED, // 禁用阴影避免遮挡
                // 确保圆形完整渲染
                stRotation: 0,
                // 优化深度测试和渲染设置
                disableDepthTestDistance: Number.POSITIVE_INFINITY, // 禁用深度测试，确保圆形完整显示
                classificationType: Cesium.ClassificationType.TERRAIN // 明确指定分类类型为地形
            },
            // 关键修复4：使用polyline模拟圆形边框（因为ellipse的outline在terrain上不支持）
            // 生成圆形边界的点来模拟边框效果
            polyline: {
                positions: new Cesium.CallbackProperty(function() {
                    // 生成圆形边界的点数组
                    const positions = [];
                    const numPoints = 128; // 足够的点数确保圆形边框平滑
                    const center = Cesium.Cartographic.fromDegrees(station.longitude, station.latitude);
                    
                    for (let i = 0; i <= numPoints; i++) {
                        const angle = (i / numPoints) * Cesium.Math.TWO_PI;
                        // 计算圆形边界上的点（考虑地球曲率）
                        const lat = center.latitude + (radiusInMeters / 6378137) * Math.cos(angle);
                        const lon = center.longitude + (radiusInMeters / (6378137 * Math.cos(center.latitude))) * Math.sin(angle);
                        positions.push(Cesium.Cartesian3.fromRadians(lon, lat, 0));
                    }
                    return positions;
                }, false),
                width: 2,
                material: new Cesium.Color(0.2, 0.4, 0.9, 0.6), // 蓝色边框，与原来的outlineColor一致
                clampToGround: true, // 贴地显示
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0.0, Number.POSITIVE_INFINITY),
                shadows: Cesium.ShadowMode.DISABLED
            }
        });
        
        // 单独创建引导线实体，确保它始终显示
        // 验证经纬度数据有效性
        if (!station.longitude || !station.latitude || 
            isNaN(station.longitude) || isNaN(station.latitude) ||
            !isFinite(station.longitude) || !isFinite(station.latitude)) {
            console.warn(`基站 ${station.stationId} 的经纬度数据无效，跳过引导线创建`);
            baseStationEntities.set(entityId, entity);
            return;
        }
        
        // 预先计算引导线位置，避免CallbackProperty中的异步问题
        const cartographic = Cesium.Cartographic.fromDegrees(
            station.longitude, 
            station.latitude
        );
        
        // 获取实际地面高度（使用同步方法，如果失败则使用默认值）
        let groundElevation = 0;
        try {
            const terrainHeight = viewer.scene.globe.getHeight(cartographic);
            if (terrainHeight !== undefined && terrainHeight !== null && isFinite(terrainHeight)) {
                groundElevation = terrainHeight;
            }
        } catch (e) {
            console.warn(`基站 ${station.stationId} 获取地形高度失败，使用默认值0:`, e);
        }
        
        // 起点：地面位置（稍微抬高一点，避免被地形遮挡）
        const startPos = Cesium.Cartesian3.fromDegrees(
            station.longitude, 
            station.latitude, 
            groundElevation + 1.0 // 抬高1米，确保不被地形遮挡
        );
        
        // 终点：地面高度 + 标签高度（确保有足够的高度差）
        const endPos = Cesium.Cartesian3.fromDegrees(
            station.longitude, 
            station.latitude, 
            groundElevation + labelHeight
        );
        
        // 验证起点和终点是否有效
        if (!startPos || !endPos) {
            console.warn(`基站 ${station.stationId} 的引导线位置计算失败`);
            baseStationEntities.set(entityId, entity);
            return;
        }
        
        // 验证高度差是否足够（至少10米）
        const heightDiff = labelHeight;
        if (heightDiff < 10) {
            console.warn(`基站 ${station.stationId} 的引导线高度差过小: ${heightDiff}米`);
        }
        
        // 不再创建基站标签的引导线（已删除）
        
        // 添加标签到主实体
        entity.label = {
            text: `基站${station.stationId}`,
            font: '14px sans-serif',
            fillColor: Cesium.Color.WHITE,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            pixelOffset: new Cesium.Cartesian2(0, -labelOffset),
            disableDepthTestDistance: 100000,
            heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND, // 相对地面高度
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM, // 标签底部对齐引导线
            distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0.0, 100000.0) // 确保标签在可见范围内
        };
        
        baseStationEntities.set(entityId, entity);
    }
    
    // 调试函数：检查所有引导线的状态
    function debugBaseStationPolylines() {
        console.log('=== 基站引导线调试信息 ===');
        let total = 0;
        let valid = 0;
        let invalid = [];
        
        baseStationEntities.forEach((entity, key) => {
            if (key.endsWith('_polyline')) {
                total++;
                const actualEntity = viewer.entities.getById(key);
                if (actualEntity && actualEntity.polyline) {
                    const polyline = actualEntity.polyline;
                    const show = polyline.show;
                    let showValue = true;
                    
                    if (show instanceof Cesium.CallbackProperty) {
                        try {
                            showValue = show.getValue();
                        } catch (e) {
                            showValue = true;
                        }
                    } else {
                        showValue = show !== false;
                    }
                    
                    // 验证positions是否有效（正确处理Property对象）
                    let positionsValid = false;
                    try {
                        const positions = polyline.positions;
                        if (positions) {
                            if (typeof positions.getValue === 'function') {
                                // 是Property对象，获取实际值
                                const positionsArray = positions.getValue();
                                positionsValid = Array.isArray(positionsArray) && positionsArray.length === 2;
                            } else if (Array.isArray(positions)) {
                                // 直接是数组
                                positionsValid = positions.length === 2;
                            }
                        }
                    } catch (e) {
                        // 忽略错误
                    }
                    
                    if (showValue && positionsValid) {
                        valid++;
                    } else {
                        invalid.push({
                            key: key,
                            show: showValue,
                            hasPositions: !!polyline.positions,
                            positionsValid: positionsValid
                        });
                    }
                } else {
                    invalid.push({
                        key: key,
                        reason: '实体未找到或polyline属性不存在'
                    });
                }
            }
        });
        
        console.log(`总计: ${total} 条引导线`);
        console.log(`有效: ${valid} 条`);
        console.log(`无效: ${invalid.length} 条`);
        if (invalid.length > 0) {
            console.log('无效的引导线:', invalid);
        }
        console.log('========================');
    }
    
    // 将调试函数暴露到全局，方便在控制台调用
    window.debugBaseStationPolylines = debugBaseStationPolylines;
    
    // 增强的诊断和修复函数
    function diagnoseAndFixPolylines() {
        console.log('=== 引导线诊断和修复 ===');
        let issues = [];
        let fixed = 0;
        
        baseStationEntities.forEach((entity, key) => {
            if (key.endsWith('_polyline')) {
                const actualEntity = viewer.entities.getById(key);
                if (!actualEntity) {
                    issues.push({key: key, issue: '实体不存在'});
                    return;
                }
                
                if (!actualEntity.polyline) {
                    issues.push({key: key, issue: 'polyline属性不存在'});
                    return;
                }
                
                const polyline = actualEntity.polyline;
                const stationId = key.replace('basestation_', '').replace('_polyline', '');
                
                // 检查1: show属性
                let showValue = true;
                try {
                    if (polyline.show && typeof polyline.show.getValue === 'function') {
                        showValue = polyline.show.getValue();
                    } else {
                        showValue = polyline.show !== false;
                    }
                } catch (e) {
                    showValue = true;
                }
                
                if (!showValue) {
                    issues.push({key: key, stationId: stationId, issue: 'show为false'});
                    polyline.show = true;
                    fixed++;
                }
                
                // 检查2: positions
                let positionsArray = null;
                try {
                    if (polyline.positions) {
                        if (typeof polyline.positions.getValue === 'function') {
                            positionsArray = polyline.positions.getValue();
                        } else if (Array.isArray(polyline.positions)) {
                            positionsArray = polyline.positions;
                        }
                    }
                } catch (e) {
                    issues.push({key: key, stationId: stationId, issue: 'positions获取失败: ' + e.message});
                }
                
                if (!positionsArray || !Array.isArray(positionsArray) || positionsArray.length !== 2) {
                    issues.push({key: key, stationId: stationId, issue: 'positions无效', positions: positionsArray});
                } else {
                    // 检查3: 距离
                    try {
                        const pos1 = positionsArray[0];
                        const pos2 = positionsArray[1];
                        if (pos1 && pos2) {
                            const distance = Cesium.Cartesian3.distance(pos1, pos2);
                            if (distance < 1.0) {
                                issues.push({key: key, stationId: stationId, issue: `距离过近: ${distance.toFixed(2)}米`});
                            }
                            
                            // 检查位置是否有效（不是NaN或Infinity）
                            const cart1 = Cesium.Cartographic.fromCartesian(pos1);
                            const cart2 = Cesium.Cartographic.fromCartesian(pos2);
                            
                            if (isNaN(cart1.longitude) || isNaN(cart1.latitude) || 
                                isNaN(cart2.longitude) || isNaN(cart2.latitude)) {
                                issues.push({key: key, stationId: stationId, issue: '位置包含NaN值'});
                            }
                        }
                    } catch (e) {
                        issues.push({key: key, stationId: stationId, issue: '距离计算失败: ' + e.message});
                    }
                }
                
                // 检查4: 材质
                if (!polyline.material) {
                    issues.push({key: key, stationId: stationId, issue: '材质不存在'});
                    polyline.material = Cesium.Color.YELLOW.withAlpha(0.9);
                    fixed++;
                }
                
                // 检查5: 线宽
                if (!polyline.width || polyline.width < 1.0) {
                    issues.push({key: key, stationId: stationId, issue: '线宽过小: ' + polyline.width});
                    polyline.width = 3.0;
                    fixed++;
                }
                
                // 强制设置关键属性
                polyline.disableDepthTestDistance = Number.POSITIVE_INFINITY;
                polyline.show = true;
                polyline.clampToGround = false;
            }
        });
        
        // 强制重新渲染
        viewer.scene.requestRender();
        
        console.log(`发现问题: ${issues.length} 个`);
        console.log(`已修复: ${fixed} 个`);
        if (issues.length > 0) {
            console.log('问题详情:', issues);
        }
        console.log('========================');
        
        return {issues: issues, fixed: fixed};
    }
    
    // 暴露诊断函数
    window.diagnoseAndFixPolylines = diagnoseAndFixPolylines;
    
    // 测试函数：创建一个测试引导线，验证基本功能
    function testPolyline() {
        console.log('=== 创建测试引导线 ===');
        const testPos1 = Cesium.Cartesian3.fromDegrees(114.04, 30.85, 0);
        const testPos2 = Cesium.Cartesian3.fromDegrees(114.04, 30.85, 100);
        
        const testEntity = viewer.entities.add({
            id: 'test_polyline',
            name: '测试引导线',
            polyline: {
                positions: [testPos1, testPos2],
                width: 5.0,
                material: Cesium.Color.RED.withAlpha(1.0),
                clampToGround: false,
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                show: true
            }
        });
        
        console.log('测试引导线已创建，应该看到一条红色粗线');
        console.log('如果看不到，说明是Cesium渲染问题');
        console.log('5秒后自动删除测试引导线');
        
        setTimeout(() => {
            viewer.entities.remove(testEntity);
            console.log('测试引导线已删除');
        }, 5000);
    }
    
    window.testPolyline = testPolyline;
    
    // 测试函数：创建一个测试基站圆形，验证基本功能
    function testBaseStationCircle() {
        console.log('=== 创建测试基站圆形 ===');
        const testPos = Cesium.Cartesian3.fromDegrees(114.04, 30.85, 0);
        const radius = 100; // 100米半径
        
        const testEntity = viewer.entities.add({
            id: 'test_base_station_circle',
            name: '测试基站圆形',
            position: testPos,
            ellipse: {
                semiMajorAxis: radius,
                semiMinorAxis: radius,
                material: Cesium.Color.RED.withAlpha(0.5),
                outline: true,
                outlineColor: Cesium.Color.RED,
                outlineWidth: 3,
                height: 0,
                extrudedHeight: 0,
                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                granularity: Cesium.Math.PI / 32,
                rotation: 0,
                numberOfVerticalLines: 32,
                distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0.0, Number.POSITIVE_INFINITY),
                shadows: Cesium.ShadowMode.DISABLED
            },
            point: {
                pixelSize: 15,
                color: Cesium.Color.RED,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 2,
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
            }
        });
        
        console.log('测试基站圆形已创建，应该看到一个红色圆形');
        console.log('如果看不到完整的圆形，说明ellipse配置有问题');
        console.log('10秒后自动删除测试圆形');
        
        setTimeout(() => {
            viewer.entities.remove(testEntity);
            console.log('测试基站圆形已删除');
        }, 10000);
    }
    
    window.testBaseStationCircle = testBaseStationCircle;
    
    // 强制修复所有基站圆形
    function fixAllBaseStations() {
        console.log('=== 修复所有基站圆形 ===');
        let ellipseFixed = 0;
        
        baseStationEntities.forEach((entity, key) => {
            // 修复基站圆形
            const actualEntity = viewer.entities.getById(key);
            if (actualEntity && actualEntity.ellipse) {
                try {
                    // 应用所有修复：确保圆形完整显示（不是多边形，不破碎）
                    actualEntity.ellipse.outline = false; // 修复1：移除outline
                    actualEntity.ellipse.granularity = Cesium.Math.PI / 720; // 修复2：每0.25度一个点
                    actualEntity.ellipse.numberOfVerticalLines = 128; // 修复3：设置足够的垂直分割线（增加到128）
                    actualEntity.ellipse.height = 0.1; // 修复：稍微抬高0.1米
                    actualEntity.ellipse.heightReference = Cesium.HeightReference.RELATIVE_TO_GROUND; // 关键修复：使用相对高度而不是CLAMP_TO_GROUND
                    actualEntity.ellipse.distanceDisplayCondition = new Cesium.DistanceDisplayCondition(0.0, Number.POSITIVE_INFINITY);
                    actualEntity.ellipse.shadows = Cesium.ShadowMode.DISABLED;
                    actualEntity.ellipse.stRotation = 0;
                    actualEntity.ellipse.disableDepthTestDistance = Number.POSITIVE_INFINITY; // 修复5：禁用深度测试
                    actualEntity.ellipse.classificationType = Cesium.ClassificationType.TERRAIN; // 修复5：明确指定分类类型
                    ellipseFixed++;
                } catch (e) {
                    console.error(`修复基站 ${key} 圆形失败:`, e);
                }
            }
        });
        
        // 强制重新渲染
        viewer.scene.requestRender();
        
        console.log(`修复完成: 圆形 ${ellipseFixed} 个`);
        console.log('========================');
    }
    
    window.fixAllBaseStations = fixAllBaseStations;
    
    // 一键测试所有功能
    function testAll() {
        console.log('=== 开始全面测试 ===');
        console.log('1. 测试引导线...');
        testPolyline();
        
        setTimeout(() => {
            console.log('2. 测试基站圆形...');
            testBaseStationCircle();
        }, 6000);
        
        setTimeout(() => {
            console.log('3. 诊断所有引导线...');
            if (typeof diagnoseAndFixPolylines === 'function') {
                diagnoseAndFixPolylines();
            }
        }, 16000);
    }
    
    window.testAll = testAll;

    // 清理资源
    window.addEventListener('beforeunload', () => {
        clearInterval(updateInterval);
        viewer.destroy();
    });
</script>

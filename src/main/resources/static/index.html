    // 刷新车辆列表 - 使用point.timeStampStr显示时间
    async function refreshVehicleList() {
        try {
            const response = await fetch(`http://${broker}:${serverPort}/points`);
            const points = await response.json();

            // 清空现有列表
            vehicleList.innerHTML = '<option value="">-- 请选择车辆 --</option>';

            // 添加新选项 - 显示车牌号和时间戳
            points.forEach((point, index) => {
                const option = document.createElement('option');
                option.value = point.name;
                // 在选项中显示车牌号和时间戳
                option.textContent = `${index + 1}. ${point.name} (${point.timeStampStr})`;
                vehicleList.appendChild(option);
            });

            updateStatus('车辆列表已刷新');

        } catch (error) {
            updateStatus(`刷新失败: ${error.message}`);
        }
    }

    // 聚焦选定车辆
    function focusVehicle() {
        const selectedPlate = vehicleList.value;
        if (!selectedPlate) return;

        // 在现有车辆中查找
        for (const [id, entity] of vehicleEntities) {
            if (id.startsWith(selectedPlate)) {
                viewer.camera.flyTo({
                    destination: entity.position.getValue(Cesium.JulianDate.now()),
                    offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-30), 500),
                    duration: 1
                });
                return;
            }
        }

        updateStatus('车辆当前不可见');
    }

    async function loadBaseStations() {
        try {

            if (!response.ok) {

    // 创建基站实体（位置圆点和监测范围圆）
    function createBaseStationEntity(station) {
        const entityId = `basestation_${station.stationId}`;
        
        // 如果已存在，先移除
        if (baseStationEntities.has(entityId)) {
            viewer.entities.remove(baseStationEntities.get(entityId));
        }
        
        // 将监测范围（米）转换为弧度（用于Cesium的圆形）
        // Cesium的圆形半径单位是米，所以直接使用
        const radiusInMeters = station.coverageRadius;
        
        // 标签高度（米）- 引导线终点高度
        const labelHeight = 120; // 增加高度确保引导线可见
        const labelOffset = 40; // 标签像素偏移量
        
        // 基站位置（地面位置）
        const basePosition = Cesium.Cartesian3.fromDegrees(station.longitude, station.latitude);
        
        // 创建引导线的起点和终点位置
        // 起点：地面位置（使用相对高度0，确保贴地）
        const groundStart = Cesium.Cartesian3.fromDegrees(
            station.longitude, 
            station.latitude, 
            0
        );
        
        // 终点：标签位置（相对地面高度，确保引导线向上延伸）
        const labelEnd = Cesium.Cartesian3.fromDegrees(
            station.longitude, 
            station.latitude, 
            labelHeight
        );
        
        // 创建基站实体
        const entity = viewer.entities.add({
            id: entityId,
            // 基站位置圆点
            position: basePosition,
            point: {
                pixelSize: 10,
                color: Cesium.Color.BLUE,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 2,
                disableDepthTestDistance: 100000,
                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND // 贴地显示
            },
            // 监测范围圆（浅色透明度适中）
            // 修复ellipse内部破碎：使用相对高度而不是CLAMP_TO_GROUND，避免采样不一致
            ellipse: {
                semiMajorAxis: radiusInMeters,
                semiMinorAxis: radiusInMeters,
                material: new Cesium.ColorMaterialProperty(
                    new Cesium.Color(0.3, 0.5, 1.0, 0.3) // 浅蓝色，透明度0.3
                ),
                // 关键修复：移除outline，因为Cesium不支持在贴地ellipse上显示outline
                outline: false, // 改为false，避免渲染冲突导致破碎
                // 关键修复：使用相对高度而不是CLAMP_TO_GROUND，避免内部破碎
                height: 0.1, // 稍微抬高0.1米，避免与地形冲突
                heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND, // 改为相对地面高度，避免采样不一致
                // 增加granularity精度，每0.25度一个点（更密集的采样）
                granularity: Cesium.Math.PI / 720, // 每0.25度一个点，确保圆形完整不破碎
                rotation: 0, // 确保圆形正对上方
                // 设置足够的垂直分割线，确保圆形完整显示
                numberOfVerticalLines: 128, // 增加到128，提供更多的垂直分割线
                // 确保圆形始终可见
                distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0.0, Number.POSITIVE_INFINITY),
                shadows: Cesium.ShadowMode.DISABLED, // 禁用阴影避免遮挡
                // 确保圆形完整渲染
                stRotation: 0,
                // 优化深度测试和渲染设置
                disableDepthTestDistance: Number.POSITIVE_INFINITY, // 禁用深度测试，确保圆形完整显示
                classificationType: Cesium.ClassificationType.TERRAIN // 明确指定分类类型为地形
            },
            // 关键修复4：使用polyline模拟圆形边框（因为ellipse的outline在terrain上不支持）
            // 生成圆形边界的点来模拟边框效果
            polyline: {
                positions: new Cesium.CallbackProperty(function() {
                    // 生成圆形边界的点数组
                    const positions = [];
                    const numPoints = 128; // 足够的点数确保圆形边框平滑
                    const center = Cesium.Cartographic.fromDegrees(station.longitude, station.latitude);
                    
                    for (let i = 0; i <= numPoints; i++) {
                        const angle = (i / numPoints) * Cesium.Math.TWO_PI;
                        // 计算圆形边界上的点（考虑地球曲率）
                        const lat = center.latitude + (radiusInMeters / 6378137) * Math.cos(angle);
                        const lon = center.longitude + (radiusInMeters / (6378137 * Math.cos(center.latitude))) * Math.sin(angle);
                        positions.push(Cesium.Cartesian3.fromRadians(lon, lat, 0));
                    }
                    return positions;
                }, false),
                width: 2,
                material: new Cesium.Color(0.2, 0.4, 0.9, 0.6), // 蓝色边框，与原来的outlineColor一致
                clampToGround: true, // 贴地显示
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0.0, Number.POSITIVE_INFINITY),
                shadows: Cesium.ShadowMode.DISABLED
            }
        });
        
        // 单独创建引导线实体，确保它始终显示
        // 验证经纬度数据有效性
        if (!station.longitude || !station.latitude || 
            isNaN(station.longitude) || isNaN(station.latitude) ||
            !isFinite(station.longitude) || !isFinite(station.latitude)) {
            console.warn(`基站 ${station.stationId} 的经纬度数据无效，跳过引导线创建`);
            baseStationEntities.set(entityId, entity);
            return;
        }
        
        // 预先计算引导线位置，避免CallbackProperty中的异步问题
        const cartographic = Cesium.Cartographic.fromDegrees(
            station.longitude, 
            station.latitude
        );
        
        // 获取实际地面高度（使用同步方法，如果失败则使用默认值）
        let groundElevation = 0;
        try {
            const terrainHeight = viewer.scene.globe.getHeight(cartographic);
            if (terrainHeight !== undefined && terrainHeight !== null && isFinite(terrainHeight)) {
                groundElevation = terrainHeight;
            }
        } catch (e) {
            console.warn(`基站 ${station.stationId} 获取地形高度失败，使用默认值0:`, e);
        }
        
        // 起点：地面位置（稍微抬高一点，避免被地形遮挡）
        const startPos = Cesium.Cartesian3.fromDegrees(
            station.longitude, 
            station.latitude, 
            groundElevation + 1.0 // 抬高1米，确保不被地形遮挡
        );
        
        // 终点：地面高度 + 标签高度（确保有足够的高度差）
        const endPos = Cesium.Cartesian3.fromDegrees(
            station.longitude, 
            station.latitude, 
            groundElevation + labelHeight
        );
        
        // 验证起点和终点是否有效
        if (!startPos || !endPos) {
            console.warn(`基站 ${station.stationId} 的引导线位置计算失败`);
            baseStationEntities.set(entityId, entity);
            return;
        }
        
        // 验证高度差是否足够（至少10米）
        const heightDiff = labelHeight;
        if (heightDiff < 10) {
            console.warn(`基站 ${station.stationId} 的引导线高度差过小: ${heightDiff}米`);
        }
        
        // 不再创建基站标签的引导线（已删除）
        
        // 添加标签到主实体
        entity.label = {
            text: `基站${station.stationId}`,
            font: '14px sans-serif',
            fillColor: Cesium.Color.WHITE,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            pixelOffset: new Cesium.Cartesian2(0, -labelOffset),
            disableDepthTestDistance: 100000,
            heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND, // 相对地面高度
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM, // 标签底部对齐引导线
            distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0.0, 100000.0) // 确保标签在可见范围内
        };
        
        baseStationEntities.set(entityId, entity);
    }
    
    // 调试函数：检查所有引导线的状态
    function debugBaseStationPolylines() {
        console.log('=== 基站引导线调试信息 ===');
        let total = 0;
        let valid = 0;
        let invalid = [];
        
        baseStationEntities.forEach((entity, key) => {
            if (key.endsWith('_polyline')) {
                total++;
                const actualEntity = viewer.entities.getById(key);
                if (actualEntity && actualEntity.polyline) {
                    const polyline = actualEntity.polyline;
                    const show = polyline.show;
                    let showValue = true;
                    
                    if (show instanceof Cesium.CallbackProperty) {
                        try {
                            showValue = show.getValue();
                        } catch (e) {
                            showValue = true;
                        }
                    } else {
                        showValue = show !== false;
                    }
                    
                    // 验证positions是否有效（正确处理Property对象）
                    let positionsValid = false;
                    try {
                        const positions = polyline.positions;
                        if (positions) {
                            if (typeof positions.getValue === 'function') {
                                // 是Property对象，获取实际值
                                const positionsArray = positions.getValue();
                                positionsValid = Array.isArray(positionsArray) && positionsArray.length === 2;
                            } else if (Array.isArray(positions)) {
                                // 直接是数组
                                positionsValid = positions.length === 2;
                            }
                        }
                    } catch (e) {
                        // 忽略错误
                    }
                    
                    if (showValue && positionsValid) {
                        valid++;
                    } else {
                        invalid.push({
                            key: key,
                            show: showValue,
                            hasPositions: !!polyline.positions,
                            positionsValid: positionsValid
                        });
                    }
                } else {
                    invalid.push({
                        key: key,
                        reason: '实体未找到或polyline属性不存在'
                    });
                }
            }
        });
        
        console.log(`总计: ${total} 条引导线`);
        console.log(`有效: ${valid} 条`);
        console.log(`无效: ${invalid.length} 条`);
        if (invalid.length > 0) {
            console.log('无效的引导线:', invalid);
        }
        console.log('========================');
    }
    
    // 将调试函数暴露到全局，方便在控制台调用
    window.debugBaseStationPolylines = debugBaseStationPolylines;
    
    // 增强的诊断和修复函数
    function diagnoseAndFixPolylines() {
        console.log('=== 引导线诊断和修复 ===');
        let issues = [];
        let fixed = 0;
        
        baseStationEntities.forEach((entity, key) => {
            if (key.endsWith('_polyline')) {
                const actualEntity = viewer.entities.getById(key);
                if (!actualEntity) {
                    issues.push({key: key, issue: '实体不存在'});
                    return;
                }
                
                if (!actualEntity.polyline) {
                    issues.push({key: key, issue: 'polyline属性不存在'});
                    return;
                }
                
                const polyline = actualEntity.polyline;
                const stationId = key.replace('basestation_', '').replace('_polyline', '');
                
                // 检查1: show属性
                let showValue = true;
                try {
                    if (polyline.show && typeof polyline.show.getValue === 'function') {
                        showValue = polyline.show.getValue();
                    } else {
                        showValue = polyline.show !== false;
                    }
                } catch (e) {
                    showValue = true;
                }
                
                if (!showValue) {
                    issues.push({key: key, stationId: stationId, issue: 'show为false'});
                    polyline.show = true;
                    fixed++;
                }
                
                // 检查2: positions
                let positionsArray = null;
                try {
                    if (polyline.positions) {
                        if (typeof polyline.positions.getValue === 'function') {
                            positionsArray = polyline.positions.getValue();
                        } else if (Array.isArray(polyline.positions)) {
                            positionsArray = polyline.positions;
                        }
                    }
                } catch (e) {
                    issues.push({key: key, stationId: stationId, issue: 'positions获取失败: ' + e.message});
                }
                
                if (!positionsArray || !Array.isArray(positionsArray) || positionsArray.length !== 2) {
                    issues.push({key: key, stationId: stationId, issue: 'positions无效', positions: positionsArray});
                } else {
                    // 检查3: 距离
                    try {
                        const pos1 = positionsArray[0];
                        const pos2 = positionsArray[1];
                        if (pos1 && pos2) {
                            const distance = Cesium.Cartesian3.distance(pos1, pos2);
                            if (distance < 1.0) {
                                issues.push({key: key, stationId: stationId, issue: `距离过近: ${distance.toFixed(2)}米`});
                            }
                            
                            // 检查位置是否有效（不是NaN或Infinity）
                            const cart1 = Cesium.Cartographic.fromCartesian(pos1);
                            const cart2 = Cesium.Cartographic.fromCartesian(pos2);
                            
                            if (isNaN(cart1.longitude) || isNaN(cart1.latitude) || 
                                isNaN(cart2.longitude) || isNaN(cart2.latitude)) {
                                issues.push({key: key, stationId: stationId, issue: '位置包含NaN值'});
                            }
                        }
                    } catch (e) {
                        issues.push({key: key, stationId: stationId, issue: '距离计算失败: ' + e.message});
                    }
                }
                
                // 检查4: 材质
                if (!polyline.material) {
                    issues.push({key: key, stationId: stationId, issue: '材质不存在'});
                    polyline.material = Cesium.Color.YELLOW.withAlpha(0.9);
                    fixed++;
                }
                
                // 检查5: 线宽
                if (!polyline.width || polyline.width < 1.0) {
                    issues.push({key: key, stationId: stationId, issue: '线宽过小: ' + polyline.width});
                    polyline.width = 3.0;
                    fixed++;
                }
                
                // 强制设置关键属性
                polyline.disableDepthTestDistance = Number.POSITIVE_INFINITY;
                polyline.show = true;
                polyline.clampToGround = false;
            }
        });
        
        // 强制重新渲染
        viewer.scene.requestRender();
        
        console.log(`发现问题: ${issues.length} 个`);
        console.log(`已修复: ${fixed} 个`);
        if (issues.length > 0) {
            console.log('问题详情:', issues);
        }
        console.log('========================');
        
        return {issues: issues, fixed: fixed};
    }
    
    // 暴露诊断函数
    window.diagnoseAndFixPolylines = diagnoseAndFixPolylines;
    
    // 测试函数：创建一个测试引导线，验证基本功能
    function testPolyline() {
        console.log('=== 创建测试引导线 ===');
        const testPos1 = Cesium.Cartesian3.fromDegrees(114.04, 30.85, 0);
        const testPos2 = Cesium.Cartesian3.fromDegrees(114.04, 30.85, 100);
        
        const testEntity = viewer.entities.add({
            id: 'test_polyline',
            name: '测试引导线',
            polyline: {
                positions: [testPos1, testPos2],
                width: 5.0,
                material: Cesium.Color.RED.withAlpha(1.0),
                clampToGround: false,
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                show: true
            }
        });
        
        console.log('测试引导线已创建，应该看到一条红色粗线');
        console.log('如果看不到，说明是Cesium渲染问题');
        console.log('5秒后自动删除测试引导线');
        
        setTimeout(() => {
            viewer.entities.remove(testEntity);
            console.log('测试引导线已删除');
        }, 5000);
    }
    
    window.testPolyline = testPolyline;
    
    // 测试函数：创建一个测试基站圆形，验证基本功能
    function testBaseStationCircle() {
        console.log('=== 创建测试基站圆形 ===');
        const testPos = Cesium.Cartesian3.fromDegrees(114.04, 30.85, 0);
        const radius = 100; // 100米半径
        
        const testEntity = viewer.entities.add({
            id: 'test_base_station_circle',
            name: '测试基站圆形',
            position: testPos,
            ellipse: {
                semiMajorAxis: radius,
                semiMinorAxis: radius,
                material: Cesium.Color.RED.withAlpha(0.5),
                outline: true,
                outlineColor: Cesium.Color.RED,
                outlineWidth: 3,
                height: 0,
                extrudedHeight: 0,
                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                granularity: Cesium.Math.PI / 32,
                rotation: 0,
                numberOfVerticalLines: 32,
                distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0.0, Number.POSITIVE_INFINITY),
                shadows: Cesium.ShadowMode.DISABLED
            },
            point: {
                pixelSize: 15,
                color: Cesium.Color.RED,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 2,
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
            }
        });
        
        console.log('测试基站圆形已创建，应该看到一个红色圆形');
        console.log('如果看不到完整的圆形，说明ellipse配置有问题');
        console.log('10秒后自动删除测试圆形');
        
        setTimeout(() => {
            viewer.entities.remove(testEntity);
            console.log('测试基站圆形已删除');
        }, 10000);
    }
    
    window.testBaseStationCircle = testBaseStationCircle;
    
    // 强制修复所有基站圆形
    function fixAllBaseStations() {
        console.log('=== 修复所有基站圆形 ===');
        let ellipseFixed = 0;
        
        baseStationEntities.forEach((entity, key) => {
            // 修复基站圆形
            const actualEntity = viewer.entities.getById(key);
            if (actualEntity && actualEntity.ellipse) {
                try {
                    // 应用所有修复：确保圆形完整显示（不是多边形，不破碎）
                    actualEntity.ellipse.outline = false; // 修复1：移除outline
                    actualEntity.ellipse.granularity = Cesium.Math.PI / 720; // 修复2：每0.25度一个点
                    actualEntity.ellipse.numberOfVerticalLines = 128; // 修复3：设置足够的垂直分割线（增加到128）
                    actualEntity.ellipse.height = 0.1; // 修复：稍微抬高0.1米
                    actualEntity.ellipse.heightReference = Cesium.HeightReference.RELATIVE_TO_GROUND; // 关键修复：使用相对高度而不是CLAMP_TO_GROUND
                    actualEntity.ellipse.distanceDisplayCondition = new Cesium.DistanceDisplayCondition(0.0, Number.POSITIVE_INFINITY);
                    actualEntity.ellipse.shadows = Cesium.ShadowMode.DISABLED;
                    actualEntity.ellipse.stRotation = 0;
                    actualEntity.ellipse.disableDepthTestDistance = Number.POSITIVE_INFINITY; // 修复5：禁用深度测试
                    actualEntity.ellipse.classificationType = Cesium.ClassificationType.TERRAIN; // 修复5：明确指定分类类型
                    ellipseFixed++;
                } catch (e) {
                    console.error(`修复基站 ${key} 圆形失败:`, e);
                }
            }
        });
        
        // 强制重新渲染
        viewer.scene.requestRender();
        
        console.log(`修复完成: 圆形 ${ellipseFixed} 个`);
        console.log('========================');
    }
    
    window.fixAllBaseStations = fixAllBaseStations;
    
    // 一键测试所有功能
    function testAll() {
        console.log('=== 开始全面测试 ===');
        console.log('1. 测试引导线...');
        testPolyline();
        
        setTimeout(() => {
            console.log('2. 测试基站圆形...');
            testBaseStationCircle();
        }, 6000);
        
        setTimeout(() => {
            console.log('3. 诊断所有引导线...');
            if (typeof diagnoseAndFixPolylines === 'function') {
                diagnoseAndFixPolylines();
            }
        }, 16000);
    }
    
    window.testAll = testAll;

    // 清理资源
    window.addEventListener('beforeunload', () => {
        clearInterval(updateInterval);
        viewer.destroy();
    });
</script>

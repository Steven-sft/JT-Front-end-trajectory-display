<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.95/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.95/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
</head>
<body>
<div id="cesiumContainer" style="width:100%;height:100vh;"></div>
<div id="infoPanel">
    <div id="panelHeader">
        <div>监控面板</div>
        <button id="toggleBtn" title="收起/展开面板">▲</button>
    </div>
    <div id="panelContent">
        <div>总车辆数: <span id="totalCount">0</span></div>
        <div>方向1车辆: <span id="direction1Count">0</span></div>
        <div>方向2车辆: <span id="direction2Count">0</span></div>
        <div id="status">状态: 连接中...</div>
        <div>当前服务器: <span id="currentBroker">10.48.53.80</span></div>
        <div>当前端口: <span id="currentPort">33368</span></div>

        <div class="control-group">
            <label for="vehicleList">选择车辆:</label>
            <select id="vehicleList">
                <option value="">-- 请选择车辆 --</option>
            </select>
            <button id="refreshBtn">刷新列表</button>
            <button id="reconnectBtn">重新连接</button>
        </div>
        
        <div class="control-group">
            <label>标签布局方案:</label>
            <select id="labelLayout">
                <option value="1">布局1: 东（90度，300-500m）</option>
                <option value="2">布局2: 南（180度，300-500m）</option>
                <option value="3">布局3: 西（270度，300-500m）</option>
                <option value="4">布局4: 北（0度，300-500m）</option>
                <option value="5">布局5: 东南（135度，300-500m）</option>
                <option value="6" selected>布局6: 东北（45度，300-500m）</option>
                <option value="7">布局7: 西南（225度，300-500m）</option>
                <option value="8">布局8: 西北（315度，300-500m）</option>
            </select>
        </div>
    </div>
</div>

<script>
    // 全局错误处理，捕获未处理的Promise错误
    window.addEventListener('error', function(event) {
        console.error('[全局错误]', event.error);
    });
    
    window.addEventListener('unhandledrejection', function(event) {
        // 忽略Cesium Ion相关的错误
        const reason = event.reason;
        if (reason) {
            // 检查是否是Ion相关的错误
            const isIonError = 
                (reason.message && (
                    reason.message.includes('Ion') || 
                    reason.message.includes('INVALID_TOKEN') ||
                    reason.message.includes('Ion access disabled')
                )) ||
                (reason.response && (
                    typeof reason.response === 'string' && reason.response.includes('INVALID_TOKEN')
                )) ||
                (reason.statusCode === 401 && reason.response && (
                    reason.response.code === 'INVALID_TOKEN' ||
                    (typeof reason.response === 'string' && reason.response.includes('INVALID_TOKEN'))
                )) ||
                (reason.url && reason.url.toString && reason.url.toString().includes('api.cesium.com'));
            
            if (isIonError) {
                // 静默忽略Ion相关错误
                event.preventDefault();
                return;
            }
        }
        // 其他错误才输出
        console.error('[未处理的Promise错误]', event.reason);
        event.preventDefault(); // 阻止默认的错误处理
    });
    
    // 从URL参数获取端口号
    const urlParams = new URLSearchParams(window.location.search);
    const serverPort = urlParams.get('port') || '33368'; // 默认端口为33368
    // 如果是在本地访问（localhost 或 127.0.0.1），默认使用 localhost；否则使用配置的地址
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const broker = urlParams.get('broker') || (isLocal ? 'localhost' : '192.168.0.5'); // 默认服务器地址

    // 在页面上显示当前使用的服务器和端口
    document.getElementById('currentBroker').textContent = broker;
    document.getElementById('currentPort').textContent = serverPort;

    // 完全禁用Cesium Ion，避免401错误（必须在Viewer创建之前）
    if (typeof Cesium !== 'undefined') {
        // 设置空的access token
        if (Cesium.Ion) {
            Cesium.Ion.defaultAccessToken = '';
        }
        
        // 拦截所有Ion相关的网络请求（更彻底的方法）
        if (Cesium.Resource) {
            const originalFetch = Cesium.Resource.prototype.fetch;
            Cesium.Resource.prototype.fetch = function() {
                const url = this.url;
                if (url && (typeof url === 'string' || url.toString)) {
                    const urlStr = url.toString();
                    if (urlStr.includes('api.cesium.com') || urlStr.includes('cesium.com/v1')) {
                        // 静默拒绝Ion请求，不输出错误
                        return Promise.reject(new Error('Ion access disabled'));
                    }
                }
                return originalFetch.apply(this, arguments);
            };
        }
        
        // 拦截XMLHttpRequest（Cesium可能使用）
        const originalXHROpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url, ...args) {
            if (url && (typeof url === 'string' || url.toString)) {
                const urlStr = url.toString();
                if (urlStr.includes('api.cesium.com') || urlStr.includes('cesium.com/v1')) {
                    // 阻止Ion请求
                    this.addEventListener('loadstart', function() {
                        this.abort();
                    });
                }
            }
            return originalXHROpen.apply(this, [method, url, ...args]);
        };
        
        // 禁用Ion Imagery Provider
        if (Cesium.IonImageryProvider) {
            const originalFromAssetId = Cesium.IonImageryProvider.fromAssetId;
            Cesium.IonImageryProvider.fromAssetId = function() {
                throw new Error('Ion Imagery Provider is disabled');
            };
        }
    }
    
    // 初始化Cesium（不加载默认Ion底图）
    // 默认使用OSM底图，并启用底图选择器
    const viewer = new Cesium.Viewer('cesiumContainer', {
        terrainProvider: new Cesium.EllipsoidTerrainProvider(), // 使用椭球体，不加载地形数据，提高速度
        timeline: false,
        animation: false,
        baseLayerPicker: true, // 启用底图选择器
        geocoder: false, // 禁用地理编码器
        homeButton: false, // 禁用主页按钮
        sceneModePicker: false, // 禁用场景模式选择器
        navigationHelpButton: false, // 禁用导航帮助按钮
        fullscreenButton: false, // 禁用全屏按钮
        requestRenderMode: false, // 禁用按需渲染，确保实时更新
        maximumRenderTimeChange: Infinity, // 减少不必要的渲染
        targetFrameRate: 60 // 设置目标帧率，确保流畅渲染
    });
    
    // 立即移除所有默认图层（包括可能的Ion图层）
    viewer.imageryLayers.removeAll();
    
    // 禁用Ion相关功能，避免401错误
    if (viewer.cesiumWidget && viewer.cesiumWidget.creditContainer) {
        // 隐藏Ion相关的credit
        const creditContainer = viewer.cesiumWidget.creditContainer;
        if (creditContainer) {
            creditContainer.style.display = 'none';
        }
    }
    
    // 强制Cesium持续渲染，即使没有用户交互
    viewer.clock.shouldAnimate = false; // 禁用时钟动画
    viewer.scene.requestRenderMode = false; // 确保禁用按需渲染
    viewer.scene.globe.enableLighting = false; // 禁用光照以提高性能
    
    // 关键修复：创建一个持续渲染的循环，确保即使没有用户交互也会渲染
    // 使用 requestAnimationFrame 创建持续渲染循环，强制Cesium持续渲染
    const continuousRenderLoop = function() {
        viewer.scene.requestRender();
        requestAnimationFrame(continuousRenderLoop);
    };
    // 启动持续渲染循环
    continuousRenderLoop();
    
    // 移除默认的Cesium Ion底图
    viewer.imageryLayers.removeAll();
    
    // 添加多个底图选项，默认使用OSM
    // OSM底图（默认）
    const osmLayer = viewer.imageryLayers.addImageryProvider(
        new Cesium.OpenStreetMapImageryProvider({
            url: 'https://a.tile.openstreetmap.org/'
        })
    );
    
    // 高德地图（作为备选）
    const gaodeLayer = viewer.imageryLayers.addImageryProvider(
        new Cesium.UrlTemplateImageryProvider({
            url: 'https://webst01.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
            credit: '高德地图',
            tilingScheme: new Cesium.WebMercatorTilingScheme(),
            maximumLevel: 18
        })
    );
    gaodeLayer.show = false; // 默认不显示，用户可以通过底图选择器切换
    
    // 设置OSM为默认显示的底图
    osmLayer.show = true;

    // 设置初始视角 - 垂直地面观察
    // 参数说明：
    // - 第一个参数：经度（longitude），范围 -180 到 180
    // - 第二个参数：纬度（latitude），范围 -90 到 90
    // - 第三个参数：高度（height），单位：米
    // 当前设置：经度114.04556274414062，纬度30.91611099243300，高度5000米，垂直向下观察
    viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(114.04556274414062, 30.91611099243300, 5000),
        orientation: {
            heading: Cesium.Math.toRadians(0),    // 朝向角度（0度=正北）
            pitch: Cesium.Math.toRadians(-90),    // 俯仰角（-90度=垂直向下）
            roll: 0.0                              // 翻滚角（通常为0）
        },
        duration: 2.0  // 飞行动画时长（秒），设置为0可立即跳转
    });

    // 车辆实体存储：车牌号 -> Cesium实体
    const vehicleEntities = new Map();
    // 最新车辆数据点存储：entityId -> point（全局变量，供避让算法使用）
    const latestPoints = new Map();
    // 基站实体存储：基站ID -> Cesium实体
    const baseStationEntities = new Map();
    let lastUpdateTime = 0;
    let connectionErrorCount = 0;
    let isPaused = false;

    // DOM元素
    const totalDisplay = document.getElementById('totalCount');
    const dir1Display = document.getElementById('direction1Count');
    const dir2Display = document.getElementById('direction2Count');
    const statusDisplay = document.getElementById('status');
    const vehicleList = document.getElementById('vehicleList');
    const refreshBtn = document.getElementById('refreshBtn');
    const reconnectBtn = document.getElementById('reconnectBtn');

    // 事件监听
    vehicleList.addEventListener('change', focusVehicle);
    refreshBtn.addEventListener('click', refreshVehicleList);
    reconnectBtn.addEventListener('click', reconnect);

    // 面板折叠功能
    const infoPanel = document.getElementById('infoPanel');
    const toggleBtn = document.getElementById('toggleBtn');
    const panelContent = document.getElementById('panelContent');

    toggleBtn.addEventListener('click', function() {
        if (panelContent.style.display === 'none') {
            panelContent.style.display = 'block';
            toggleBtn.textContent = '▲';
            toggleBtn.title = '收起面板';
            // 恢复展开状态时的宽度
            infoPanel.style.width = '';
        } else {
            panelContent.style.display = 'none';
            toggleBtn.textContent = '▼';
            toggleBtn.title = '展开面板';
            // 折叠时缩小面板宽度
            infoPanel.style.width = '140px';
        }
    });

    // 标签布局方案（1-8）：1-东，2-南，3-西，4-北，5-东南，6-东北，7-西南，8-西北
    let currentLabelLayout = 6; // 默认布局6（东北）
    
    // 存储每个标签的当前布局（用于避让时切换布局）
    const entityLayouts = new Map(); // entityId -> layout (1-8)
    
    // 获取布局选择器
    const labelLayoutSelect = document.getElementById('labelLayout');
    labelLayoutSelect.addEventListener('change', function() {
        currentLabelLayout = parseInt(this.value);
        // 重新计算所有标签位置
        vehicleEntities.forEach((entity, entityId) => {
            const point = latestPoints.get(entityId);
            if (point && entity.position) {
                updateLabelPosition(entity, point, entityId);
            }
        });
    });

    // 初始化
    updateStatus('正在加载...');
    loadBaseStations();
    fetchVehicleData();

    // 启动定时更新
    const updateInterval = setInterval(() => {
        if (!isPaused) {
            fetchVehicleData();
        }
    }, 400);
    
    // 确保Cesium使用默认渲染循环，持续渲染
    viewer.useDefaultRenderLoop = true;

    // 获取车辆数据
    async function fetchVehicleData() {
        try {
            const [points, numbers] = await Promise.all([
                 fetchWithTimeout(`http://${broker}:${serverPort}/points`, 10000),
                fetchWithTimeout(`http://${broker}:${serverPort}/number`, 3000)
            ]);

            if (!points.ok || !numbers.ok) {
                throw new Error(`API响应错误: points ${points.status}, numbers ${numbers.status}`);
            }

            const pointsData = await points.json();
            const numbersData = await numbers.json();

            // 调试：检查接收到的数据中是否包含 specialFlag 字段
            if (pointsData && pointsData.length > 0) {
                const firstPoint = pointsData[0];
                if (firstPoint.specialFlag !== undefined) {
                    console.log(`[调试-接收数据] 第一个点的 specialFlag:`, firstPoint.specialFlag, "类型:", typeof firstPoint.specialFlag);
                } else {
                    console.log(`[调试-接收数据] 第一个点没有 specialFlag 字段，可用字段:`, Object.keys(firstPoint));
                }
            }

            updatePoints(pointsData);
            updateNumbers(numbersData);
            connectionErrorCount = 0;
            updateStatus(`最后更新: ${new Date().toLocaleTimeString()}`);

        } catch (error) {
            handleFetchError(error);
        }
    }

    // 带超时的fetch
    function fetchWithTimeout(url, timeout) {
        return Promise.race([
            fetch(url),
            new Promise((_, reject) =>
                setTimeout(() => reject(new Error('请求超时')), timeout)
            )
        ]);
    }

    // 更新点数据（增量更新）
    function updatePoints(points) {
        const startTime = Date.now();
        const newVehicleIds = new Set();

        // 处理所有点，如果同一辆车有多个点，只保留最后一个（按顺序处理，后面的覆盖前面的）
        // 先收集所有车辆的最新位置（使用全局的latestPoints Map）
        latestPoints.clear(); // 清空旧数据
        points.forEach(point => {
            const entityId = `${point.name}_${point.id}`;
            // 如果同一辆车有多个点，保留最后一个（时间戳最新的）
            if (!latestPoints.has(entityId)) {
                latestPoints.set(entityId, point);
            } else {
                // 比较时间戳，保留更新的
                const existingPoint = latestPoints.get(entityId);
                const existingTime = existingPoint.timeStampStr || '';
                const newTime = point.timeStampStr || '';
                // 如果新点的时间戳更新，则替换
                if (newTime > existingTime || !existingTime) {
                    latestPoints.set(entityId, point);
                }
            }
            newVehicleIds.add(entityId);
        });

        // 更新或新增车辆实体（使用每个车辆的最新位置）
        // 先收集所有车辆位置，用于计算标签重叠避免
        const vehiclePositions = new Map();
        latestPoints.forEach((point, entityId) => {
            const newPosition = Cesium.Cartesian3.fromDegrees(point.longitude, point.latitude);
            vehiclePositions.set(entityId, newPosition);
        });
        
        latestPoints.forEach((point, entityId) => {
            const newPosition = vehiclePositions.get(entityId);

            if (!vehicleEntities.has(entityId)) {
                // 创建新实体
                const entity = viewer.entities.add(createVehicleEntity(point, entityId, vehiclePositions));
                vehicleEntities.set(entityId, entity);
            } else {
                // 更新现有实体位置
                const entity = vehicleEntities.get(entityId);

                // 更新车辆位置
                entity.position = newPosition;
                
                // 更新标签内容和样式
                entity.label.text = `${point.name} | ${point.timeStampStr} | ${point.id}`;
                // 字号改为16
                entity.label.font = '16px sans-serif';
                
                // 确保标签显示（检查show属性是否为CallbackProperty，如果是则保持，否则设为true）
                if (!(entity.label.show instanceof Cesium.CallbackProperty)) {
                    entity.label.show = true;
                }
                
                // 更新标签位置和连接线（使用布局方案）
                updateLabelPosition(entity, point, entityId, newPosition);
                
                // 强制刷新polyline，确保引导线完整显示
                if (entity.polyline) {
                    // 确保show属性为true（不使用CallbackProperty）
                    entity.polyline.show = true;
                    
                    // 确保引导线完整显示的属性（强制应用所有设置）
                    entity.polyline.show = true;
                    entity.polyline.width = 3;
                    entity.polyline.material = Cesium.Color.BLUE.withAlpha(0.9);
                    entity.polyline.disableDepthTestDistance = Number.POSITIVE_INFINITY;
                    entity.polyline.distanceDisplayCondition = new Cesium.DistanceDisplayCondition(0.0, Number.POSITIVE_INFINITY);
                    entity.polyline.shadows = Cesium.ShadowMode.DISABLED;
                    entity.polyline.classificationType = Cesium.ClassificationType.BOTH;
                    entity.polyline.depthFailMaterial = Cesium.Color.BLUE.withAlpha(0.9);
                    entity.polyline.clampToGround = false;
                    entity.polyline.arcType = Cesium.ArcType.NONE;
                    // 移除可能影响显示的属性
                    entity.polyline.scaleByDistance = undefined;
                    entity.polyline.translucencyByDistance = undefined;
                    
                    // 强制触发positions更新
                    try {
                        const positions = entity.polyline.positions;
                        if (positions instanceof Cesium.CallbackProperty) {
                            // 通过重新赋值来强制触发更新
                            entity.polyline.positions = positions;
                        }
                    } catch (e) {
                        console.error(`[引导线] ${entityId}: 刷新positions失败`, e);
                    }
                    
                    // 强制触发渲染
                    viewer.scene.requestRender();
                    
                    // 调试：输出polyline状态（仅对前几个车辆，避免刷屏）
                    if (Math.random() < 0.05) {
                        try {
                            const posArray = entity.polyline.positions instanceof Cesium.CallbackProperty 
                                ? entity.polyline.positions.getValue() 
                                : entity.polyline.positions;
                            console.log(`[引导线调试] ${entityId}:`, {
                                hasPolyline: !!entity.polyline,
                                show: entity.polyline.show,
                                width: entity.polyline.width,
                                hasPositions: !!posArray,
                                positionsLength: posArray ? posArray.length : 0,
                                positionsValid: posArray && Array.isArray(posArray) && posArray.length === 2
                            });
                        } catch (e) {
                            // 忽略调试错误
                        }
                    }
                } else {
                    // 如果polyline不存在，重新创建
                    console.warn(`[引导线修复] ${entityId}: polyline不存在，重新创建`);
                    updateLabelPosition(entity, point, entityId, newPosition);
                }
                
                // 调试：输出标签位置信息
                if (Math.random() < 0.01) { // 随机输出1%的调试信息，避免刷屏
                    console.log(`[标签调试] 车辆 ${point.name}: eyeOffset=`, entity.label.eyeOffset, 
                                'show=', entity.label.show);
                }
                
                // 判断是否为预测点（specialFlag字段为99，支持数字和字符串类型）
                // 调试：检查 specialFlag 的值和类型
                if (point.specialFlag !== undefined && point.specialFlag !== null) {
                    console.log(`[调试-更新] 车辆 ${point.name} (ID: ${point.id}) specialFlag:`, point.specialFlag, "类型:", typeof point.specialFlag, "是否预测点:", (point.specialFlag === 99 || point.specialFlag === "99"));
                }
                const isPredicted = point.specialFlag === 99 || point.specialFlag === "99";
                // 预测点使用绿色标签，普通点使用橙色标签
                entity.label.fillColor = isPredicted ? Cesium.Color.GREEN : new Cesium.Color(1.0, 0.647, 0.0, 1.0);
                entity.label.outlineColor = Cesium.Color.BLACK; // 黑色描边
                entity.label.outlineWidth = 3;
                entity.label.style = Cesium.LabelStyle.FILL_AND_OUTLINE;
                
                // 预测点的位置点也使用绿色，普通点根据direction设置颜色
                if (isPredicted) {
                    entity.point.color = Cesium.Color.GREEN;
                } else {
                    entity.point.color = point.direction === 1 ? Cesium.Color.RED : Cesium.Color.BLUE;
                }
                // 设置height为0，避免地形轮廓线警告
                if (entity.point) {
                    entity.point.height = 0;
                }
            }
        });

        // 移除消失的车辆
        vehicleEntities.forEach((entity, id) => {
            if (!newVehicleIds.has(id)) {
                viewer.entities.remove(entity);
                vehicleEntities.delete(id);
            }
        });

        // 强制触发渲染，确保位置更新立即显示
        // 使用多种方式确保渲染
        viewer.scene.requestRender();
        // 强制更新所有实体的位置，触发重新渲染
        latestPoints.forEach((point, entityId) => {
            const entity = vehicleEntities.get(entityId);
            if (entity && entity.position) {
                // 强制触发位置属性更新
                const newPosition = Cesium.Cartesian3.fromDegrees(point.longitude, point.latitude);
                entity.position = newPosition;
            }
        });
        
        // 再次请求渲染
        viewer.scene.requestRender();
        
        // 在所有标签更新完成后，执行标签避让算法
        // 使用setTimeout确保所有标签位置都已更新
        setTimeout(() => {
            try {
                if (vehicleEntities && vehicleEntities.size > 0) {
                    avoidLabelOverlap();
                }
            } catch (e) {
                console.error('[避让算法调用] 错误:', e);
            }
        }, 100);
        
        // 启动持续运行的避让算法（每1秒运行一次，更快响应重叠）
        if (!window.labelAvoidanceInterval) {
            window.labelAvoidanceInterval = setInterval(() => {
                try {
                    if (!isPaused && vehicleEntities && vehicleEntities.size > 0) {
                        avoidLabelOverlap();
                    }
                } catch (e) {
                    console.error('[避让算法定时器] 错误:', e);
                }
            }, 1000); // 改为1秒运行一次，更快响应重叠
        }

        console.log(`更新${points.length}个数据点，处理后${latestPoints.size}辆车，耗时${Date.now() - startTime}ms`);
    }
    
    // 字符串哈希函数（用于生成稳定的方向选择）- 提前定义
    function hashString(str) {
        if (!str) return 0;
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash; // 转换为32位整数
        }
        return hash;
    }
    
    // 标签避让算法：基于屏幕空间的碰撞检测和动态调整
    // 将标签投影到屏幕坐标，检测屏幕上的矩形重叠，避免标签在屏幕上重叠显示
    function avoidLabelOverlap() {
        try {
            // 检查是否有车辆数据
            if (!vehicleEntities || vehicleEntities.size === 0) {
                return;
            }
            
            // 检查viewer是否已初始化
            if (!viewer || !viewer.scene || !viewer.camera) {
                return;
            }
            
            // 1. 收集所有标签的屏幕坐标和边界框
            const labelInfos = [];
            
            vehicleEntities.forEach((entity, entityId) => {
                if (!entity.label || !entity.position) return;
                
                try {
                    // 获取车辆的世界坐标位置
                    const vehicleWorldPos = entity.position.getValue();
                    if (!vehicleWorldPos) return;
                    
                    // 获取当前的eyeOffset
                    let eyeOffset = entity.label.eyeOffset;
                    if (eyeOffset instanceof Cesium.Cartesian3) {
                        eyeOffset = Cesium.Cartesian3.clone(eyeOffset);
                    } else if (eyeOffset && eyeOffset.getValue) {
                        eyeOffset = Cesium.Cartesian3.clone(eyeOffset.getValue());
                    } else {
                        eyeOffset = new Cesium.Cartesian3(0, 0, 0);
                    }
                    
                    // 计算标签的3D世界位置
                    const camera = viewer.camera;
                    const cameraRight = camera.right;
                    const cameraUp = camera.up;
                    const cameraForward = camera.direction;
                    
                    // 将eyeOffset转换为世界坐标偏移
                    const worldOffset = new Cesium.Cartesian3(
                        cameraRight.x * eyeOffset.x + cameraUp.x * eyeOffset.y + cameraForward.x * eyeOffset.z,
                        cameraRight.y * eyeOffset.x + cameraUp.y * eyeOffset.y + cameraForward.y * eyeOffset.z,
                        cameraRight.z * eyeOffset.x + cameraUp.z * eyeOffset.y + cameraForward.z * eyeOffset.z
                    );
                    
                    const labelWorldPos = Cesium.Cartesian3.add(vehicleWorldPos, worldOffset, new Cesium.Cartesian3());
                    
                    // 投影到屏幕坐标
                    const screenPos = Cesium.SceneTransforms.wgs84ToWindowCoordinates(viewer.scene, labelWorldPos);
                    if (!screenPos) return;
                    
                    // 估算标签的屏幕边界框（需要根据实际标签大小调整）
                    const labelWidth = 120;  // 标签宽度（像素）
                    const labelHeight = 40;  // 标签高度（像素）
                    const padding = 5;       // 额外间距（像素）
                    
                    const screenRect = {
                        left: screenPos.x - labelWidth / 2 - padding,
                        right: screenPos.x + labelWidth / 2 + padding,
                        top: screenPos.y - labelHeight / 2 - padding,
                        bottom: screenPos.y + labelHeight / 2 + padding,
                        centerX: screenPos.x,
                        centerY: screenPos.y
                    };
                    
                    labelInfos.push({
                        entity: entity,
                        entityId: entityId,
                        vehiclePos: vehicleWorldPos,
                        labelWorldPos: labelWorldPos,
                        eyeOffset: eyeOffset,
                        screenPos: screenPos,
                        screenRect: screenRect
                    });
                } catch (e) {
                    // 忽略单个标签的错误
                }
            });
            
            // 2. 检测屏幕空间重叠并调整（多标签避让 + 切换布局方向策略）
            const minSeparation = 250; // 最小分离距离（像素）- 增加到250像素，让标签更松散
            const preferredSeparation = 300; // 首选分离距离（像素）- 理想情况下标签应该保持这个距离
            
            // 调试：输出检测到的标签数量
            if (labelInfos.length > 0) {
                console.log(`[避让算法] 检测到 ${labelInfos.length} 个标签`);
            }
            
            // 存储需要避让的标签（允许多个标签同时避让，实现更松散的分布）
            const labelsToAvoid = new Set();
            // 存储每个标签的重叠信息，用于更智能的避让决策
            const overlapInfo = new Map(); // entityId -> { overlaps: Set<entityId>, minDistance: number }
            
            // 存储每个标签的避让状态，避免频繁切换布局
            const avoidanceState = new Map(); // entityId -> { lastAvoidanceTime, lastLayout }
            
            // 检测重叠和距离
            for (let i = 0; i < labelInfos.length; i++) {
                for (let j = i + 1; j < labelInfos.length; j++) {
                    const info1 = labelInfos[i];
                    const info2 = labelInfos[j];
                    
                    // 计算分离向量（屏幕空间）
                    const dx = info2.screenRect.centerX - info1.screenRect.centerX;
                    const dy = info2.screenRect.centerY - info1.screenRect.centerY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    // 检测屏幕矩形重叠或距离过近
                    if (isRectOverlap(info1.screenRect, info2.screenRect) || distance < minSeparation) {
                        const key1 = info1.entityId;
                        const key2 = info2.entityId;
                        
                        // 记录重叠信息
                        if (!overlapInfo.has(key1)) {
                            overlapInfo.set(key1, { overlaps: new Set(), minDistance: Infinity });
                        }
                        if (!overlapInfo.has(key2)) {
                            overlapInfo.set(key2, { overlaps: new Set(), minDistance: Infinity });
                        }
                        
                        overlapInfo.get(key1).overlaps.add(key2);
                        overlapInfo.get(key2).overlaps.add(key1);
                        overlapInfo.get(key1).minDistance = Math.min(overlapInfo.get(key1).minDistance, distance);
                        overlapInfo.get(key2).minDistance = Math.min(overlapInfo.get(key2).minDistance, distance);
                        
                        // 如果距离太近，两个标签都需要避让（实现更松散的分布）
                        if (distance < minSeparation) {
                            labelsToAvoid.add(key1);
                            labelsToAvoid.add(key2);
                        } else if (isRectOverlap(info1.screenRect, info2.screenRect)) {
                            // 如果只是重叠但距离较远，只让其中一个避让（选择重叠更多的）
                            const overlapCount1 = overlapInfo.get(key1).overlaps.size;
                            const overlapCount2 = overlapInfo.get(key2).overlaps.size;
                            if (overlapCount1 > overlapCount2) {
                                labelsToAvoid.add(key1);
                            } else if (overlapCount2 > overlapCount1) {
                                labelsToAvoid.add(key2);
                            } else {
                                // 重叠数量相同，选择ID较小的
                                const avoidEntityId = key1 < key2 ? key1 : key2;
                                labelsToAvoid.add(avoidEntityId);
                            }
                        }
                        
                        // 调试：输出重叠信息
                        console.log(`[避让检测] 标签 ${key1} 和 ${key2} 重叠/过近，距离 ${distance.toFixed(1)} 像素`);
                    }
                }
            }
            
            // 调试：输出需要避让的标签数量
            console.log(`[避让算法] 检测到 ${labelsToAvoid.size} 个标签需要避让:`, Array.from(labelsToAvoid));
            
            // 3. 对需要避让的标签切换布局方向
            labelsToAvoid.forEach((entityId) => {
                try {
                    const entity = vehicleEntities.get(entityId);
                    if (!entity) return;
                    
                    // 获取当前布局（如果没有，使用默认布局）
                    let currentLayout = entityLayouts.get(entityId);
                    if (!currentLayout) {
                        currentLayout = currentLabelLayout;
                        entityLayouts.set(entityId, currentLayout);
                    }
                    
                    // 检查是否最近已经避让过（减少冷却时间到1.5秒，让避让更及时）
                    const lastState = avoidanceState.get(entityId);
                    const now = Date.now();
                    if (lastState && (now - lastState.lastAvoidanceTime < 1500)) {
                        // 最近避让过，但如果当前布局仍然有重叠，仍然需要避让
                        const currentInfo = labelInfos.find(info => info.entityId === entityId);
                        if (currentInfo) {
                            let hasOverlap = false;
                            for (const otherInfo of labelInfos) {
                                if (otherInfo.entityId === entityId) continue;
                                if (isRectOverlap(currentInfo.screenRect, otherInfo.screenRect)) {
                                    hasOverlap = true;
                                    break;
                                }
                            }
                            if (!hasOverlap) {
                                // 没有重叠，跳过避让
                                return;
                            }
                        } else {
                            // 找不到当前标签信息，跳过
                            return;
                        }
                    }
                    
                    // 选择最能长期避让的布局（测试所有可能的布局，选择与其他标签重叠最少的）
                    const availableLayouts = [1, 2, 3, 4, 5, 6, 7, 8]; // 8个方向
                    const otherLayouts = availableLayouts.filter(l => l !== currentLayout);
                    
                    if (otherLayouts.length > 0) {
                        // 获取当前标签的车辆位置
                        const point = latestPoints.get(entityId);
                        if (point && entity.position) {
                            const vehiclePosition = entity.position.getValue();
                            if (vehiclePosition) {
                                // 测试每个可能的布局，找到与其他标签重叠最少且距离最远的布局
                                let bestLayout = currentLayout;
                                let minOverlaps = Infinity;
                                let bestAvgDistance = 0;
                                
                                // 先计算当前布局的评分
                                const currentInfo = labelInfos.find(info => info.entityId === entityId);
                                if (currentInfo) {
                                    let currentOverlaps = 0;
                                    let currentTotalDist = 0;
                                    let currentNeighborCount = 0;
                                    for (const otherInfo of labelInfos) {
                                        if (otherInfo.entityId === entityId) continue;
                                        if (isRectOverlap(currentInfo.screenRect, otherInfo.screenRect)) {
                                            currentOverlaps++;
                                        }
                                        const dx = currentInfo.screenRect.centerX - otherInfo.screenRect.centerX;
                                        const dy = currentInfo.screenRect.centerY - otherInfo.screenRect.centerY;
                                        const dist = Math.sqrt(dx * dx + dy * dy);
                                        currentTotalDist += dist;
                                        currentNeighborCount++;
                                    }
                                    minOverlaps = currentOverlaps;
                                    bestAvgDistance = currentNeighborCount > 0 ? currentTotalDist / currentNeighborCount : 0;
                                }
                                
                                for (const testLayout of otherLayouts) {
                                    // 计算使用该布局时的标签位置
                                    const { offsetX, offsetY, offsetZ } = calculateLabelOffset(point, entityId, vehiclePosition, testLayout);
                                    
                                    // 将eyeOffset转换为世界坐标
                                    const camera = viewer.camera;
                                    const worldOffset = new Cesium.Cartesian3(
                                        camera.right.x * offsetX + camera.up.x * offsetY + camera.direction.x * offsetZ,
                                        camera.right.y * offsetX + camera.up.y * offsetY + camera.direction.y * offsetZ,
                                        camera.right.z * offsetX + camera.up.z * offsetY + camera.direction.z * offsetZ
                                    );
                                    const testLabelWorldPos = Cesium.Cartesian3.add(vehiclePosition, worldOffset, new Cesium.Cartesian3());
                                    
                                    // 投影到屏幕坐标
                                    const testScreenPos = Cesium.SceneTransforms.wgs84ToWindowCoordinates(viewer.scene, testLabelWorldPos);
                                    if (!testScreenPos) continue;
                                    
                                    // 计算屏幕矩形
                                    const labelWidth = 120;
                                    const labelHeight = 40;
                                    const padding = 5;
                                    const testScreenRect = {
                                        left: testScreenPos.x - labelWidth / 2 - padding,
                                        right: testScreenPos.x + labelWidth / 2 + padding,
                                        top: testScreenPos.y - labelHeight / 2 - padding,
                                        bottom: testScreenPos.y + labelHeight / 2 + padding,
                                        centerX: testScreenPos.x,
                                        centerY: testScreenPos.y
                                    };
                                    
                                    // 计算与其他标签的重叠数量和平均距离
                                    let overlapCount = 0;
                                    let totalDistance = 0;
                                    let neighborCount = 0;
                                    let minDistance = Infinity;
                                    
                                    for (const otherInfo of labelInfos) {
                                        if (otherInfo.entityId === entityId) continue; // 跳过自己
                                        
                                        // 计算屏幕距离
                                        const dx = testScreenRect.centerX - otherInfo.screenRect.centerX;
                                        const dy = testScreenRect.centerY - otherInfo.screenRect.centerY;
                                        const distance = Math.sqrt(dx * dx + dy * dy);
                                        
                                        if (isRectOverlap(testScreenRect, otherInfo.screenRect)) {
                                            overlapCount++;
                                        }
                                        
                                        // 记录距离信息（用于选择更松散的布局）
                                        totalDistance += distance;
                                        neighborCount++;
                                        minDistance = Math.min(minDistance, distance);
                                    }
                                    
                                    // 计算平均距离
                                    const avgDistance = neighborCount > 0 ? totalDistance / neighborCount : 0;
                                    
                                    // 优化布局选择策略：
                                    // 1. 优先选择重叠最少的布局
                                    // 2. 如果重叠数量相同，选择平均距离最远的布局（实现更松散的分布）
                                    let isBetter = false;
                                    if (overlapCount < minOverlaps) {
                                        // 重叠更少，直接选择
                                        isBetter = true;
                                    } else if (overlapCount === minOverlaps && avgDistance > bestAvgDistance) {
                                        // 重叠数量相同，但平均距离更远，选择它（实现更松散的分布）
                                        isBetter = true;
                                    }
                                    
                                    if (isBetter) {
                                        minOverlaps = overlapCount;
                                        bestAvgDistance = avgDistance;
                                        bestLayout = testLayout;
                                    }
                                }
                                
                                // 如果找到了更好的布局，应用它
                                if (bestLayout !== currentLayout) {
                                    console.log(`[标签避让] ${entityId}: 从布局${currentLayout}切换到布局${bestLayout}，重叠数从${minOverlaps + 1}减少到${minOverlaps}`);
                                    
                                    // 更新布局（关键：必须在设置eyeOffset之前更新）
                                    entityLayouts.set(entityId, bestLayout);
                                    
                                    // 使用最佳布局重新计算eyeOffset
                                    const { offsetX, offsetY, offsetZ } = calculateLabelOffset(point, entityId, vehiclePosition, bestLayout);
                                    
                                    // 直接设置eyeOffset（不通过updateLabelPosition，避免被覆盖）
                                    entity.label.eyeOffset = new Cesium.Cartesian3(offsetX, offsetY, offsetZ);
                                    
                                    console.log(`[标签避让] ${entityId}: 已设置eyeOffset为布局${bestLayout}的偏移`, { offsetX, offsetY, offsetZ });
                                    
                                    // 记录避让状态
                                    avoidanceState.set(entityId, {
                                        lastAvoidanceTime: Date.now(),
                                        lastLayout: bestLayout
                                    });
                                    
                                    // 强制触发引导线更新（多重方式确保更新）
                                    // 关键：避让算法修改eyeOffset后，必须立即更新引导线，确保引导线能正确显示
                                    const point = latestPoints.get(entityId);
                                    if (point) {
                                        // 方式1：立即调用updateLabelPosition来更新引导线
                                        // updateLabelPosition中有逻辑保护避让布局的eyeOffset，所以可以安全调用
                                        // 它会重新创建引导线的CallbackProperty，确保能访问到最新的eyeOffset
                                        updateLabelPosition(entity, point, entityId, vehiclePosition);
                                        
                                        // 方式2：额外确保引导线的positions能正确更新
                                        // 立即重新赋值positions，强制触发CallbackProperty重新计算
                                        if (entity.polyline && entity.polyline.positions) {
                                            try {
                                                const positions = entity.polyline.positions;
                                                if (positions instanceof Cesium.CallbackProperty) {
                                                    // 通过重新赋值来强制触发CallbackProperty重新计算
                                                    entity.polyline.positions = positions;
                                                }
                                            } catch (e) {
                                                console.warn(`[引导线更新] ${entityId}: 更新positions失败`, e);
                                            }
                                        }
                                    }
                                    
                                    // 强制触发渲染
                                    viewer.scene.requestRender();
                                } else {
                                    console.log(`[标签避让] ${entityId}: 当前布局${currentLayout}已是最优，重叠数${minOverlaps}`);
                                    // 没有找到更好的布局，记录当前状态
                                    avoidanceState.set(entityId, {
                                        lastAvoidanceTime: Date.now(),
                                        lastLayout: currentLayout
                                    });
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.warn(`[标签避让] ${entityId} 切换布局失败:`, e);
                }
            });
            
            // 布局切换后，强制更新所有引导线并重新渲染场景
            // 确保所有修改了eyeOffset的标签的引导线都能正确显示
            let updatedCount = 0;
            labelsToAvoid.forEach((entityId) => {
                const entity = vehicleEntities.get(entityId);
                if (entity) {
                    const point = latestPoints.get(entityId);
                    if (point && entity.position) {
                        try {
                            const vehiclePosition = entity.position.getValue();
                            if (vehiclePosition) {
                                // 调用updateLabelPosition来更新引导线
                                // 这会重新创建引导线的CallbackProperty，确保能访问到最新的eyeOffset
                                updateLabelPosition(entity, point, entityId, vehiclePosition);
                                updatedCount++;
                            }
                        } catch (e) {
                            console.warn(`[引导线更新] ${entityId}: 更新失败`, e);
                        }
                    }
                    
                    // 额外确保引导线的positions能正确更新
                    if (entity.polyline && entity.polyline.positions) {
                        try {
                            const positions = entity.polyline.positions;
                            if (positions instanceof Cesium.CallbackProperty) {
                                // 通过重新赋值来强制触发CallbackProperty重新计算
                                entity.polyline.positions = positions;
                            }
                        } catch (e) {
                            // 忽略错误
                        }
                    }
                }
            });
            
            if (updatedCount > 0) {
                console.log(`[避让算法] 已更新 ${updatedCount} 个标签的引导线`);
            }
            
            // 标签避让算法完成后，强制重新渲染场景
            viewer.scene.requestRender();
        } catch (e) {
            console.error('[屏幕空间标签避让] 错误:', e);
        }
    }
    
    // 检测矩形重叠（屏幕空间）
    function isRectOverlap(rect1, rect2) {
        return !(rect1.right < rect2.left || 
                 rect1.left > rect2.right || 
                 rect1.bottom < rect2.top || 
                 rect1.top > rect2.bottom);
    }
    
    
    // 调整标签的屏幕偏移（将屏幕偏移转换为eyeOffset）
    function adjustLabelScreenOffset(labelInfo, screenOffsetX, screenOffsetY) {
        try {
            const camera = viewer.camera;
            
            // 计算相机到标签的距离
            const distance = Cesium.Cartesian3.distance(
                viewer.camera.position,
                labelInfo.labelWorldPos
            );
            
            if (distance < 1) {
                // 距离太近，跳过
                return;
            }
            
            // 使用更准确的方法：通过屏幕坐标反推世界坐标
            // 获取当前标签的屏幕位置
            const currentScreenPos = labelInfo.screenPos;
            if (!currentScreenPos) return;
            
            // 计算目标屏幕位置
            const targetScreenX = currentScreenPos.x + screenOffsetX;
            const targetScreenY = currentScreenPos.y + screenOffsetY;
            
            // 使用Cesium的pickRay来将屏幕坐标转换为世界坐标
            // 创建一个从相机到标签方向的射线
            const ray = viewer.camera.getPickRay(new Cesium.Cartesian2(targetScreenX, targetScreenY));
            if (!ray) return;
            
            // 计算射线与标签所在平面的交点
            // 使用标签到相机的距离来确定交点
            const direction = Cesium.Cartesian3.normalize(ray.direction, new Cesium.Cartesian3());
            const targetWorldPos = Cesium.Cartesian3.add(
                viewer.camera.position,
                Cesium.Cartesian3.multiplyByScalar(direction, distance, new Cesium.Cartesian3()),
                new Cesium.Cartesian3()
            );
            
            // 计算需要的世界坐标偏移
            const worldOffset = Cesium.Cartesian3.subtract(
                targetWorldPos,
                labelInfo.labelWorldPos,
                new Cesium.Cartesian3()
            );
            
            // 将世界坐标偏移转换为eyeOffset（相机空间）
            const cameraRight = camera.right;
            const cameraUp = camera.up;
            const cameraForward = camera.direction;
            
            const eyeOffsetX = Cesium.Cartesian3.dot(worldOffset, cameraRight);
            const eyeOffsetY = Cesium.Cartesian3.dot(worldOffset, cameraUp);
            const eyeOffsetZ = Cesium.Cartesian3.dot(worldOffset, cameraForward);
            
            labelInfo.eyeOffset.x += eyeOffsetX;
            labelInfo.eyeOffset.y += eyeOffsetY;
            labelInfo.eyeOffset.z += eyeOffsetZ;
        } catch (e) {
            console.warn('[adjustLabelScreenOffset] 错误:', e);
        }
    }
    
    // 更新标签的屏幕位置
    function updateScreenPosition(labelInfo) {
        try {
            const camera = viewer.camera;
            
            // 将eyeOffset转换为世界坐标偏移
            const worldOffset = new Cesium.Cartesian3(
                camera.right.x * labelInfo.eyeOffset.x + camera.up.x * labelInfo.eyeOffset.y + camera.direction.x * labelInfo.eyeOffset.z,
                camera.right.y * labelInfo.eyeOffset.x + camera.up.y * labelInfo.eyeOffset.y + camera.direction.y * labelInfo.eyeOffset.z,
                camera.right.z * labelInfo.eyeOffset.x + camera.up.z * labelInfo.eyeOffset.y + camera.direction.z * labelInfo.eyeOffset.z
            );
            
            // 更新标签的世界位置
            labelInfo.labelWorldPos = Cesium.Cartesian3.add(
                labelInfo.vehiclePos,
                worldOffset,
                new Cesium.Cartesian3()
            );
            
            // 重新投影到屏幕坐标
            const screenPos = Cesium.SceneTransforms.wgs84ToWindowCoordinates(
                viewer.scene,
                labelInfo.labelWorldPos
            );
            
            if (screenPos) {
                labelInfo.screenPos = screenPos;
                
                // 更新屏幕矩形
                const labelWidth = 120;
                const labelHeight = 40;
                const padding = 5;
                
                labelInfo.screenRect.centerX = screenPos.x;
                labelInfo.screenRect.centerY = screenPos.y;
                labelInfo.screenRect.left = screenPos.x - labelWidth / 2 - padding;
                labelInfo.screenRect.right = screenPos.x + labelWidth / 2 + padding;
                labelInfo.screenRect.top = screenPos.y - labelHeight / 2 - padding;
                labelInfo.screenRect.bottom = screenPos.y + labelHeight / 2 + padding;
            }
        } catch (e) {
            console.warn('[updateScreenPosition] 错误:', e);
        }
    }

    // 计算标签位置和偏移（根据布局方案）- 8个方向布局
    function calculateLabelOffset(point, entityId, vehiclePosition, layout) {
        try {
            // 根据entityId生成一个稳定的哈希值，用于计算偏移
            let hash = 0;
            if (entityId && entityId.length > 0) {
                for (let i = 0; i < entityId.length; i++) {
                    hash = ((hash << 5) - hash) + entityId.charCodeAt(i);
                    hash = hash & hash; // 转换为32位整数
                }
            }
            
            // 增加偏移距离到300-500m，避免标签太近
            const offsetDistance = 300 + (Math.abs(hash) % 201); // 300-500m
            // 增加高度变化范围，避免标签和引导线重合
            const offsetZ = (Math.abs(hash) % 101) - 50; // -50到50米，更大的高度变化
            
            let offsetX, offsetY, offsetAngle;
            
            // 8个布局方向：1-东，2-南，3-西，4-北，5-东南，6-东北，7-西南，8-西北
            // 确保layout在有效范围内（1-8）
            const validLayout = (layout >= 1 && layout <= 8) ? layout : 5;
            
            switch(validLayout) {
                case 1: // 布局1: 东（90度）
                    offsetAngle = Math.PI / 2; // 90度（东）
                    break;
                    
                case 2: // 布局2: 南（180度）
                    offsetAngle = Math.PI; // 180度（南）
                    break;
                    
                case 3: // 布局3: 西（270度）
                    offsetAngle = -Math.PI / 2; // -90度（270度，西）
                    break;
                    
                case 4: // 布局4: 北（0度）
                    offsetAngle = 0; // 0度（北）
                    break;
                    
                case 5: // 布局5: 东南（135度）
                    offsetAngle = 3 * Math.PI / 4; // 135度（东南）
                    break;
                    
                case 6: // 布局6: 东北（45度）
                    offsetAngle = Math.PI / 4; // 45度（东北）
                    break;
                    
                case 7: // 布局7: 西南（225度）
                    offsetAngle = -3 * Math.PI / 4; // -135度（225度，西南）
                    break;
                    
                case 8: // 布局8: 西北（315度）
                    offsetAngle = -Math.PI / 4; // -45度（315度，西北）
                    break;
                    
                default:
                    offsetAngle = Math.PI / 4; // 默认：东北（45度）
            }
            
            // 计算偏移值
            offsetX = Math.sin(offsetAngle) * offsetDistance;
            offsetY = -Math.cos(offsetAngle) * offsetDistance;
            
            // 修复5：优化数值验证和错误处理
            // 验证所有值都是有效数字
            if (isNaN(offsetX) || isNaN(offsetY) || isNaN(offsetZ) || 
                !isFinite(offsetX) || !isFinite(offsetY) || !isFinite(offsetZ)) {
                console.error(`[calculateLabelOffset] ${entityId}: 计算结果包含无效值`, {
                    offsetX, offsetY, offsetZ, offsetDistance, offsetAngle, layout
                });
                // 返回安全的默认值（确保距离足够，引导线可见）
                return { offsetX: 300, offsetY: -300, offsetZ: 50 };
            }
            
            // 修复5：验证偏移距离是否足够（至少100米，确保引导线可见）
            const offsetMagnitude = Math.sqrt(offsetX * offsetX + offsetY * offsetY);
            if (offsetMagnitude < 100) {
                console.warn(`[calculateLabelOffset] ${entityId}: 偏移距离过小 ${offsetMagnitude.toFixed(2)}米，调整为100米`);
                const scale = 100 / offsetMagnitude;
                return { offsetX: offsetX * scale, offsetY: offsetY * scale, offsetZ: offsetZ };
            }
            
            return { offsetX, offsetY, offsetZ };
        } catch (e) {
            console.error(`[calculateLabelOffset] ${entityId}: 计算错误`, e);
            // 返回安全的默认值（确保距离足够，引导线可见）
            return { offsetX: 300, offsetY: -300, offsetZ: 50 };
        }
    }
    
    // 更新标签位置和连接线
    function updateLabelPosition(entity, point, entityId, vehiclePosition) {
        if (!vehiclePosition) {
            vehiclePosition = entity.position.getValue();
        }
        
        // 获取该标签的布局（如果已设置避让布局，使用避让布局；否则使用默认布局）
        let labelLayout = entityLayouts.get(entityId);
        if (!labelLayout) {
            labelLayout = currentLabelLayout;
            entityLayouts.set(entityId, labelLayout);
        }
        
        // 计算标签偏移（基础偏移，避让算法会在此基础上调整）
        const { offsetX, offsetY, offsetZ } = calculateLabelOffset(point, entityId, vehiclePosition, labelLayout);
        
        // 获取当前的eyeOffset（如果存在，可能是避让算法调整后的值）
        let currentEyeOffset = entity.label.eyeOffset;
        if (currentEyeOffset instanceof Cesium.Cartesian3) {
            currentEyeOffset = Cesium.Cartesian3.clone(currentEyeOffset);
        } else if (currentEyeOffset && currentEyeOffset.getValue) {
            currentEyeOffset = Cesium.Cartesian3.clone(currentEyeOffset.getValue());
        } else {
            currentEyeOffset = null;
        }
        
        // 计算基础偏移的世界坐标
        const cartographic = Cesium.Cartographic.fromCartesian(vehiclePosition);
        const latOffsetRadians = offsetY / 6378137;
        const lonOffsetRadians = offsetX / (6378137 * Math.cos(cartographic.latitude));
        const baseLabelWorldPos = Cesium.Cartesian3.fromRadians(
            cartographic.longitude + lonOffsetRadians,
            cartographic.latitude + latOffsetRadians,
            cartographic.height + offsetZ
        );
        
        // 如果当前eyeOffset存在，计算其对应的世界位置
        let currentLabelWorldPos = baseLabelWorldPos;
        if (currentEyeOffset) {
            const camera = viewer.camera;
            const worldOffset = new Cesium.Cartesian3(
                camera.right.x * currentEyeOffset.x + camera.up.x * currentEyeOffset.y + camera.direction.x * currentEyeOffset.z,
                camera.right.y * currentEyeOffset.x + camera.up.y * currentEyeOffset.y + camera.direction.y * currentEyeOffset.z,
                camera.right.z * currentEyeOffset.x + camera.up.z * currentEyeOffset.y + camera.direction.z * currentEyeOffset.z
            );
            currentLabelWorldPos = Cesium.Cartesian3.add(vehiclePosition, worldOffset, new Cesium.Cartesian3());
        }
        
        // 关键修复：检查该标签是否有避让布局（entityLayouts中有记录）
        // 如果有避让布局，说明避让算法已经设置了eyeOffset，应该保留它
        const hasAvoidanceLayout = entityLayouts.has(entityId);
        const savedLayout = entityLayouts.get(entityId);
        
        if (hasAvoidanceLayout && savedLayout && savedLayout !== currentLabelLayout) {
            // 该标签有避让布局，且与默认布局不同，说明是避让算法设置的
            // 检查当前eyeOffset是否与避让布局计算出的偏移一致
            const { offsetX: savedOffsetX, offsetY: savedOffsetY, offsetZ: savedOffsetZ } = 
                calculateLabelOffset(point, entityId, vehiclePosition, savedLayout);
            
            // 计算当前eyeOffset与避让布局计算出的偏移的差异
            if (currentEyeOffset && Cesium.defined(currentEyeOffset) &&
                !isNaN(currentEyeOffset.x) && !isNaN(currentEyeOffset.y) && !isNaN(currentEyeOffset.z) &&
                isFinite(currentEyeOffset.x) && isFinite(currentEyeOffset.y) && isFinite(currentEyeOffset.z)) {
                
                const savedEyeOffset = new Cesium.Cartesian3(savedOffsetX, savedOffsetY, savedOffsetZ);
                const diffX = Math.abs(currentEyeOffset.x - savedEyeOffset.x);
                const diffY = Math.abs(currentEyeOffset.y - savedEyeOffset.y);
                const diffZ = Math.abs(currentEyeOffset.z - savedEyeOffset.z);
                const diffMagnitude = Math.sqrt(diffX * diffX + diffY * diffY + diffZ * diffZ);
                
                // 如果差异很小（小于10米），说明eyeOffset已经正确，保留它
                // 如果差异很大，说明可能被其他地方修改了，重新设置为避让布局的偏移
                if (diffMagnitude < 10) {
                    // eyeOffset已经正确，保留它
                    // 不重置
                } else {
                    // eyeOffset被修改了，重新设置为避让布局的偏移
                    entity.label.eyeOffset = savedEyeOffset;
                }
            } else {
                // 当前eyeOffset无效，设置为避让布局的偏移
                entity.label.eyeOffset = new Cesium.Cartesian3(savedOffsetX, savedOffsetY, savedOffsetZ);
            }
        } else {
            // 没有避让布局，使用正常的逻辑
            if (currentEyeOffset && Cesium.defined(currentEyeOffset) &&
                !isNaN(currentEyeOffset.x) && !isNaN(currentEyeOffset.y) && !isNaN(currentEyeOffset.z) &&
                isFinite(currentEyeOffset.x) && isFinite(currentEyeOffset.y) && isFinite(currentEyeOffset.z)) {
                
                // 计算基础偏移和当前偏移的差异
                const offsetDiff = Cesium.Cartesian3.subtract(baseLabelWorldPos, currentLabelWorldPos, new Cesium.Cartesian3());
                const offsetDiffLength = Cesium.Cartesian3.magnitude(offsetDiff);
                
                // 如果差异很小（小于50米），说明可能是车辆位置变化导致的，重置为基础偏移
                // 如果差异很大（超过50米），说明可能是避让算法设置的，保留它
                if (offsetDiffLength < 50) {
                    // 差异很小，重置为基础偏移
                    entity.label.eyeOffset = new Cesium.Cartesian3(offsetX, offsetY, offsetZ);
                }
                // 否则保持当前的eyeOffset，不重置
            } else {
                // 当前eyeOffset无效，重置为基础偏移
                entity.label.eyeOffset = new Cesium.Cartesian3(offsetX, offsetY, offsetZ);
            }
        }
        
        // 计算标签的实际世界坐标位置（使用当前的eyeOffset，而不是基础偏移）
        const finalEyeOffset = entity.label.eyeOffset;
        const camera = viewer.camera;
        const finalWorldOffset = new Cesium.Cartesian3(
            camera.right.x * finalEyeOffset.x + camera.up.x * finalEyeOffset.y + camera.direction.x * finalEyeOffset.z,
            camera.right.y * finalEyeOffset.x + camera.up.y * finalEyeOffset.y + camera.direction.y * finalEyeOffset.z,
            camera.right.z * finalEyeOffset.x + camera.up.z * finalEyeOffset.y + camera.direction.z * finalEyeOffset.z
        );
        const labelWorldPosition = Cesium.Cartesian3.add(vehiclePosition, finalWorldOffset, new Cesium.Cartesian3());
        
        // 更新或创建连接线（全面修复 + 调试）
        // 使用闭包保存point和entityId，避免在CallbackProperty中访问可能变化的值
        const savedPoint = point;
        const savedEntityId = entityId;
        const savedVehiclePosition = vehiclePosition;
        const savedLabelWorldPosition = labelWorldPosition;
        
        // 调试计数器，用于追踪特定车辆的引导线
        const debugCounter = { count: 0 };
        
        const createPolylineCallback = () => {
            return new Cesium.CallbackProperty(() => {
                debugCounter.count++;
                // 每100次调用输出一次调试信息（避免刷屏）
                const shouldDebug = debugCounter.count % 100 === 0;
                
                try {
                    // 获取当前实体位置
                    if (!entity || !entity.position) {
                        if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: entity或position不存在`);
                        return [savedVehiclePosition, savedLabelWorldPosition];
                    }
                    
                    let currentPos;
                    try {
                        currentPos = entity.position.getValue();
                    } catch (e) {
                        if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: 获取position失败`, e);
                        return [savedVehiclePosition, savedLabelWorldPosition];
                    }
                    
                    if (!currentPos || !Cesium.defined(currentPos)) {
                        if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: currentPos未定义`);
                        return [savedVehiclePosition, savedLabelWorldPosition];
                    }
                    
                    // 验证currentPos
                    if (typeof currentPos.x !== 'number' || typeof currentPos.y !== 'number' || typeof currentPos.z !== 'number' ||
                        isNaN(currentPos.x) || isNaN(currentPos.y) || isNaN(currentPos.z) ||
                        !isFinite(currentPos.x) || !isFinite(currentPos.y) || !isFinite(currentPos.z)) {
                        if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: currentPos包含无效值`, currentPos);
                        return [savedVehiclePosition, savedLabelWorldPosition];
                    }
                    
                    // 转换为地理坐标
                    let cart;
                    try {
                        cart = Cesium.Cartographic.fromCartesian(currentPos);
                    } catch (e) {
                        if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: 坐标转换失败`, e);
                        return [savedVehiclePosition, savedLabelWorldPosition];
                    }
                    
                    if (!cart || isNaN(cart.longitude) || isNaN(cart.latitude) || 
                        !isFinite(cart.longitude) || !isFinite(cart.latitude)) {
                        if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: cart包含无效值`, cart);
                        return [savedVehiclePosition, savedLabelWorldPosition];
                    }
                    
                    // 关键修复：直接使用当前的eyeOffset计算标签位置，而不是使用savedLabelWorldPosition
                    // 这样可以确保避让算法切换布局后，引导线能正确显示
                    if (entity.label && entity.label.eyeOffset) {
                        try {
                            // 获取当前的eyeOffset（可能是避让算法调整后的值）
                            let currentEyeOffset = entity.label.eyeOffset;
                            if (currentEyeOffset instanceof Cesium.Cartesian3) {
                                currentEyeOffset = Cesium.Cartesian3.clone(currentEyeOffset);
                            } else if (currentEyeOffset && currentEyeOffset.getValue) {
                                currentEyeOffset = Cesium.Cartesian3.clone(currentEyeOffset.getValue());
                            } else {
                                currentEyeOffset = null;
                            }
                            
                            if (currentEyeOffset && Cesium.defined(currentEyeOffset) &&
                                !isNaN(currentEyeOffset.x) && !isNaN(currentEyeOffset.y) && !isNaN(currentEyeOffset.z) &&
                                isFinite(currentEyeOffset.x) && isFinite(currentEyeOffset.y) && isFinite(currentEyeOffset.z)) {
                                
                                // 将eyeOffset转换为世界坐标偏移
                                const camera = viewer.camera;
                                const worldOffset = new Cesium.Cartesian3(
                                    camera.right.x * currentEyeOffset.x + camera.up.x * currentEyeOffset.y + camera.direction.x * currentEyeOffset.z,
                                    camera.right.y * currentEyeOffset.x + camera.up.y * currentEyeOffset.y + camera.direction.y * currentEyeOffset.z,
                                    camera.right.z * currentEyeOffset.x + camera.up.z * currentEyeOffset.y + camera.direction.z * currentEyeOffset.z
                                );
                                
                                // 计算标签的实际世界坐标位置
                                const labelWorldPos = Cesium.Cartesian3.add(currentPos, worldOffset, new Cesium.Cartesian3());
                                
                                // 验证labelPos
                                if (labelWorldPos && Cesium.defined(labelWorldPos) &&
                                    !isNaN(labelWorldPos.x) && !isNaN(labelWorldPos.y) && !isNaN(labelWorldPos.z) &&
                                    isFinite(labelWorldPos.x) && isFinite(labelWorldPos.y) && isFinite(labelWorldPos.z)) {
                                    return [currentPos, labelWorldPos];
                                }
                            }
                        } catch (e) {
                            if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: eyeOffset计算失败`, e);
                        }
                    }
                    
                    // Fallback：使用savedLabelWorldPosition（调整到当前车辆位置）
                    if (savedLabelWorldPosition && Cesium.defined(savedLabelWorldPosition) &&
                        !isNaN(savedLabelWorldPosition.x) && !isNaN(savedLabelWorldPosition.y) && !isNaN(savedLabelWorldPosition.z) &&
                        isFinite(savedLabelWorldPosition.x) && isFinite(savedLabelWorldPosition.y) && isFinite(savedLabelWorldPosition.z)) {
                        // 计算标签位置相对于保存的车辆位置的偏移向量
                        const offsetVector = Cesium.Cartesian3.subtract(savedLabelWorldPosition, savedVehiclePosition, new Cesium.Cartesian3());
                        // 将偏移向量应用到当前车辆位置，得到调整后的标签位置
                        const adjustedLabelPos = Cesium.Cartesian3.add(currentPos, offsetVector, new Cesium.Cartesian3());
                        
                        // 验证调整后的labelPos
                        if (adjustedLabelPos && Cesium.defined(adjustedLabelPos) &&
                            !isNaN(adjustedLabelPos.x) && !isNaN(adjustedLabelPos.y) && !isNaN(adjustedLabelPos.z) &&
                            isFinite(adjustedLabelPos.x) && isFinite(adjustedLabelPos.y) && isFinite(adjustedLabelPos.z)) {
                            return [currentPos, adjustedLabelPos];
                        }
                    }
                    
                    // 最后的fallback
                    if (shouldDebug) console.warn(`[引导线调试] ${savedEntityId}: 所有方法都失败，使用fallback`);
                    return [savedVehiclePosition, savedLabelWorldPosition];
                } catch (e) {
                    console.error(`[引导线错误] ${savedEntityId}: 未捕获的异常`, e);
                    return [savedVehiclePosition, savedLabelWorldPosition]; // 恢复原来的fallback
                }
            }, false);
        };
        
        // 简化show属性：直接设置为true，不使用CallbackProperty，避免显示问题
        // 强制重新创建polyline，确保所有属性都正确
        // 先移除旧的polyline属性（如果存在）
        if (entity.polyline) {
            try {
                // 尝试清理旧的属性
                if (entity.polyline.positions && entity.polyline.positions instanceof Cesium.CallbackProperty) {
                    // CallbackProperty无法直接删除，但可以重新赋值
                }
            } catch (e) {
                // 忽略错误
            }
        }
        
        // 创建新的polyline（每次都重新创建，确保一致性）
        // 关键修复：show直接设置为true，不使用CallbackProperty
        entity.polyline = {
            positions: createPolylineCallback(),
            width: 3,
            material: Cesium.Color.BLUE.withAlpha(0.9), // 提高不透明度
            clampToGround: false,
            show: true,  // 直接设置为true，不使用CallbackProperty
            disableDepthTestDistance: Number.POSITIVE_INFINITY,  // 确保在最顶层显示
            arcType: Cesium.ArcType.NONE, // 直线连接
            distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0.0, Number.POSITIVE_INFINITY), // 确保始终可见
            shadows: Cesium.ShadowMode.DISABLED, // 禁用阴影
            classificationType: Cesium.ClassificationType.BOTH, // 确保在地面和3D Tiles上都可见
            depthFailMaterial: Cesium.Color.BLUE.withAlpha(0.9) // 深度测试失败时的材质
        };
        
        // 强制触发渲染
        viewer.scene.requestRender();
        
        // 验证并修复polyline（延迟验证，确保Cesium已处理）
        setTimeout(() => {
            if (entity.polyline) {
                const positions = entity.polyline.positions;
                const show = entity.polyline.show;
                let showValue = true;
                try {
                    if (show instanceof Cesium.CallbackProperty) {
                        showValue = show.getValue();
                    } else {
                        showValue = show;
                    }
                } catch (e) {
                    showValue = true;
                }
                
                // 如果show为false，强制设置为true
                if (!showValue) {
                    console.warn(`[引导线修复] ${entityId}: show为false，强制设置为true`);
                    entity.polyline.show = true;
                    viewer.scene.requestRender();
                }
                
                // 验证positions是否有效
                try {
                    if (positions instanceof Cesium.CallbackProperty) {
                        const posArray = positions.getValue();
                        if (!posArray || !Array.isArray(posArray) || posArray.length !== 2) {
                            console.warn(`[引导线修复] ${entityId}: positions无效，重新创建`, posArray);
                            entity.polyline.positions = createPolylineCallback();
                            viewer.scene.requestRender();
                        }
                    }
                } catch (e) {
                    console.warn(`[引导线修复] ${entityId}: positions获取失败，重新创建`, e);
                    entity.polyline.positions = createPolylineCallback();
                    viewer.scene.requestRender();
                }
                
                // 输出验证信息（仅对前几个车辆输出，避免刷屏）
                if (Math.random() < 0.1) {
                    console.log(`[引导线验证] ${entityId}:`, {
                        hasPolyline: !!entity.polyline,
                        hasPositions: !!positions,
                        positionsType: positions ? (positions instanceof Cesium.CallbackProperty ? 'CallbackProperty' : typeof positions) : 'null',
                        hasShow: !!show,
                        showValue: showValue,
                        width: entity.polyline.width,
                        hasMaterial: !!entity.polyline.material
                    });
                }
            } else {
                console.error(`[引导线错误] ${entityId}: polyline不存在`);
            }
        }, 200);
    }

    // 创建车辆实体 - 使用point.timeStampStr显示时间
    function createVehicleEntity(point, entityId, vehiclePositions) {
        // 判断是否为预测点（specialFlag字段为99，支持数字和字符串类型）
        // 调试：检查 specialFlag 的值和类型
        if (point.specialFlag !== undefined && point.specialFlag !== null) {
            console.log(`[调试-创建] 车辆 ${point.name} (ID: ${point.id}) specialFlag:`, point.specialFlag, "类型:", typeof point.specialFlag);
        }
        const isPredicted = point.specialFlag === 99 || point.specialFlag === "99";
        
        // 根据是否为预测点设置不同的颜色
        // 预测点：位置点和标签都使用绿色
        // 普通点：位置点根据direction设置（1=红色，其他=蓝色），标签使用橙色
        const pointColor = isPredicted 
            ? Cesium.Color.GREEN
            : (point.direction === 1 ? Cesium.Color.RED : Cesium.Color.BLUE);
        const labelColor = isPredicted 
            ? Cesium.Color.GREEN 
            : new Cesium.Color(1.0, 0.647, 0.0, 1.0); // 橙色
        
        // 车辆位置
        const currentPosition = Cesium.Cartesian3.fromDegrees(point.longitude, point.latitude);
        
        // 使用布局计算函数计算标签偏移
        const { offsetX, offsetY, offsetZ } = calculateLabelOffset(point, entityId, currentPosition, currentLabelLayout);
        
        // 计算标签的实际世界坐标位置（考虑3D偏移）
        const cartographic = Cesium.Cartographic.fromCartesian(currentPosition);
        const latOffsetRadians = offsetY / 6378137;
        const lonOffsetRadians = offsetX / (6378137 * Math.cos(cartographic.latitude));
        const labelWorldPosition = Cesium.Cartesian3.fromRadians(
            cartographic.longitude + lonOffsetRadians,
            cartographic.latitude + latOffsetRadians,
            cartographic.height + offsetZ
        );
        
        return {
            position: currentPosition,
            point: {
                pixelSize: 6, // 减小点大小
                color: pointColor,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 1, // 减小边框宽度
                disableDepthTestDistance: Number.POSITIVE_INFINITY, // 确保在最顶层显示
                height: 0 // 设置height为0，避免地形轮廓线警告
            },
            label: {
                // 在标签中显示车牌号和时间戳字符串
                text: `${point.name} | ${point.timeStampStr}`,
                font: '16px sans-serif', // 字号改为16
                fillColor: labelColor,
                outlineColor: Cesium.Color.BLACK, // 黑色描边
                outlineWidth: 3, // 描边宽度
                style: Cesium.LabelStyle.FILL_AND_OUTLINE, // 确保使用填充和描边样式
                
                // 使用eyeOffset实现3D空间偏移（根据布局方案）
                // eyeOffset是相对于相机视角的3D偏移，不受entity.position影响
                eyeOffset: new Cesium.Cartesian3(offsetX, offsetY, offsetZ),
                
                // 标签显示逻辑：当车辆数量超过500时，只在近距离显示标签
                show: new Cesium.CallbackProperty(() => {
                    const cameraHeight = viewer.camera.positionCartographic.height;
                    return vehicleEntities.size <= 500 || cameraHeight <= 2000;
                }, false),
                disableDepthTestDistance: Number.POSITIVE_INFINITY  // 确保在最顶层显示
            },
            polyline: {
                // 连接线：从轨迹点到标签位置（使用CallbackProperty动态更新，增强错误处理）
                positions: new Cesium.CallbackProperty(() => {
                    try {
                        const entity = vehicleEntities.get(entityId);
                        if (!entity || !entity.position) {
                            return [currentPosition, labelWorldPosition];
                        }
                        
                        let currentPos;
                        try {
                            currentPos = entity.position.getValue();
                        } catch (e) {
                            return [currentPosition, labelWorldPosition];
                        }
                        
                        if (!currentPos || !Cesium.defined(currentPos) ||
                            isNaN(currentPos.x) || isNaN(currentPos.y) || isNaN(currentPos.z) ||
                            !isFinite(currentPos.x) || !isFinite(currentPos.y) || !isFinite(currentPos.z)) {
                            return [currentPosition, labelWorldPosition];
                        }
                        
                        let cart;
                        try {
                            cart = Cesium.Cartographic.fromCartesian(currentPos);
                        } catch (e) {
                            return [currentPosition, labelWorldPosition];
                        }
                        
                        if (!cart || isNaN(cart.longitude) || isNaN(cart.latitude) ||
                            !isFinite(cart.longitude) || !isFinite(cart.latitude)) {
                            return [currentPosition, labelWorldPosition];
                        }
                        
                        const offset = calculateLabelOffset(point, entityId, currentPos, currentLabelLayout);
                        
                        if (isNaN(offset.offsetX) || isNaN(offset.offsetY) || isNaN(offset.offsetZ) ||
                            !isFinite(offset.offsetX) || !isFinite(offset.offsetY) || !isFinite(offset.offsetZ)) {
                            return [currentPosition, labelWorldPosition];
                        }
                        
                        const cosLat = Math.cos(cart.latitude);
                        if (Math.abs(cosLat) < 0.0001) {
                            // 极地附近，使用简化计算
                            const latOff = offset.offsetY / 6378137;
                            const lonOff = offset.offsetX / 6378137;
                            const labelPos = Cesium.Cartesian3.fromRadians(
                                cart.longitude + lonOff,
                                cart.latitude + latOff,
                                (cart.height || 0) + offset.offsetZ
                            );
                            if (labelPos && Cesium.defined(labelPos) &&
                                !isNaN(labelPos.x) && !isNaN(labelPos.y) && !isNaN(labelPos.z)) {
                                return [currentPos, labelPos];
                            }
                        } else {
                            const latOff = offset.offsetY / 6378137;
                            const lonOff = offset.offsetX / (6378137 * cosLat);
                            
                            if (isNaN(latOff) || isNaN(lonOff) ||
                                !isFinite(latOff) || !isFinite(lonOff)) {
                                return [currentPosition, labelWorldPosition];
                            }
                            
                            let labelPos;
                            try {
                                labelPos = Cesium.Cartesian3.fromRadians(
                                    cart.longitude + lonOff,
                                    cart.latitude + latOff,
                                    (cart.height || 0) + offset.offsetZ
                                );
                            } catch (e) {
                                return [currentPosition, labelWorldPosition];
                            }
                            
                            if (labelPos && Cesium.defined(labelPos) &&
                                !isNaN(labelPos.x) && !isNaN(labelPos.y) && !isNaN(labelPos.z) &&
                                isFinite(labelPos.x) && isFinite(labelPos.y) && isFinite(labelPos.z)) {
                                return [currentPos, labelPos];
                            }
                        }
                        
                        return [currentPosition, labelWorldPosition];
                    } catch (e) {
                        return [currentPosition, labelWorldPosition];
                    }
                }, false),
                width: 3, // 增加线宽，更容易看到
                material: Cesium.Color.BLUE.withAlpha(0.9), // 增加不透明度到0.9，更容易看到
                clampToGround: false, // 不贴地，使用3D空间
                show: true,  // 关键：直接设置为true，确保显示（不使用CallbackProperty）
                disableDepthTestDistance: Number.POSITIVE_INFINITY,  // 确保在最顶层显示
                arcType: Cesium.ArcType.NONE, // 直线连接
                distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0.0, Number.POSITIVE_INFINITY), // 确保始终可见
                shadows: Cesium.ShadowMode.DISABLED, // 禁用阴影避免遮挡
                classificationType: Cesium.ClassificationType.BOTH, // 确保在地面和3D Tiles上都可见
                depthFailMaterial: Cesium.Color.BLUE.withAlpha(0.9), // 深度测试失败时的材质
                // 关键修复：确保引导线完整显示
                scaleByDistance: undefined, // 不使用距离缩放
                translucencyByDistance: undefined // 不使用距离透明度
            }
        };
    }
